<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Felt — Table on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#262626}
.app{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#ECE8DF;background:#262626}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:#ABABAB}
.btn{height:52px;border-radius:14px;border:1px solid #4A4A4A;background:#383838;color:#ECE8DF;font:700 16px 'Bricolage Grotesque',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box}
.btn.primary{background:#E6B85C;border-color:#E6B85C;color:#1A1408}
.btn.danger{border-color:#6E3A36;color:#F2A096;background:#3A2726}
.card{background:#F6F2E9;border-radius:7px;box-shadow:0 5px 12px rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;font-weight:700;line-height:1;font-variant-emoji:text}
.card .su{align-self:flex-end;font-size:1.3em}
.card.md{width:44px;height:62px;padding:5px 6px;font-size:18px}
.card.xl{width:74px;height:104px;padding:8px 9px;font-size:28px;border-radius:10px}
.card.sm{width:18px;height:25px;border-radius:4px}
.back{background-color:#D9534F;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 3px,transparent 3px 6px);border:1.5px solid #F6F2E9}
.slot{background:rgba(0,0,0,.14);border:1.5px dashed rgba(236,232,223,.22);box-shadow:none}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2}
.pod{display:flex;flex-direction:column;align-items:center;padding:5px 8px;background:#333333;border:1px solid #4A4A4A;border-radius:12px;min-width:58px}
.pod.folded{opacity:.45}.pod.out{opacity:.55;border-style:dashed}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#14110C;margin-top:-18px;border:2px solid #333333}
.preset{flex:1;height:34px;border-radius:9px;border:1px solid #4A4A4A;background:#1F1F1F;color:#D4D4D4;font:600 12px 'Bricolage Grotesque',sans-serif}
.preset.on{border-color:#E6B85C;color:#E6B85C}
</style>
</helmet>
<div class="app" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px">
    <button class="btn" aria-label="Menu" style="width: 44px; height: 44px; background: transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <div style="text-align: center">
      <div style="font-weight: 700; font-size: 15px">Friday Night Game</div>
      <div class="muted" style="font-size: 12px">NLH <span class="mono">1/2</span> · Hand <span class="mono">#42</span></div>
    </div>
    <button class="btn" aria-label="Ledger" style="width: 44px; height: 44px; background: transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M8 10h8M8 14h8M8 18h5"></path></svg></button>
  </header>

  <div style="flex: 1; padding: 34px 40px 70px; position: relative">
    <div style="position: relative; height: 100%; border-radius: 999px; background: #1C1C1C; padding: 10px; box-sizing: border-box; box-shadow: inset 0 0 0 1px #111111">
      <div style="position: relative; width: 100%; height: 100%; border-radius: 999px; background: radial-gradient(ellipse at 50% 40%, {{feltHi}} 0%, {{felt}} 75%); box-shadow: inset 0 0 0 2px rgba(255,255,255,.14)">
        <div style="position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; gap: 10px">
          <span style="padding: 4px 12px; border-radius: 999px; background: rgba(0,0,0,.35); font-size: 13px">Pot <b class="mono" style="color: #F4D28E">217</b></span>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px">
            <sc-for list="{{board}}" as="c" hint-placeholder-count="4">
              <div class="card md" style="color: {{c.color}}"><span>{{c.r}}</span><span class="su">{{c.s}}</span></div>
            </sc-for>
            <div class="card md slot"></div>
          </div>
        </div>
        <sc-for list="{{seats}}" as="p" hint-placeholder-count="7">
          <div class="seat" style="left: {{p.x}}%; top: {{p.y}}%">
            <div class="pod {{p.cls}}">
              <div class="av" style="background: {{p.hue}}">{{p.ini}}</div>
              <span style="font-size: 12px; font-weight: 600">{{p.name}}</span>
              <span class="mono" style="font-size: 12px; color: #E6B85C">{{p.stack}}</span>
            </div>
            <sc-if value="{{p.hasTag}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: {{p.tagBg}}; color: {{p.tagFg}}">{{p.tag}}</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 10px">
      <div class="card xl" style="color: {{h1.color}}; transform: rotate(-5deg)"><span>{{h1.r}}</span><span class="su">{{h1.s}}</span></div>
      <div class="card xl" style="color: {{h2.color}}; transform: rotate(5deg)"><span>{{h2.r}}</span><span class="su">{{h2.s}}</span></div>
    </div>
  </div>

  <div style="padding: 12px 16px 20px; background: #303030; border-top: 1px solid #3D3D3D; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px">
      <span><b>You</b> · <span class="mono" style="color: #E6B85C">476</span> · Top pair</span>
      <span class="mono muted">14s</span>
    </div>
    <div style="height: 4px; border-radius: 2px; background: #444444"><div style="width: 62%; height: 100%; border-radius: 2px; background: #E6B85C"></div></div>
    <div style="display: flex; gap: 6px">
      <button class="preset">Min</button><button class="preset on" aria-pressed="true">½ pot</button><button class="preset">Pot</button><button class="preset">All-in</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button class="btn danger">Fold</button>
      <button class="btn">Call <span class="mono">60</span></button>
      <button class="btn primary">Raise <span class="mono">199</span></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fourColor":{"editor":"boolean","default":true,"section":"Table"},"felt":{"editor":"enum","options":["green","teal","wine"],"default":"green","section":"Table"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const four = this.props.fourColor ?? true;
    const felts = { green: ['#3DAA6E', '#1F8549'], teal: ['#3A9DB0', '#1E6F80'], wine: ['#B0404F', '#7A2333'] };
    const f = felts[this.props.felt ?? 'green'] || felts.green;
    const fc = { '♠': '#17191B', '♥': '#C42B38', '♦': '#1E5BC6', '♣': '#1B7F45' };
    const col = (s) => four ? fc[s] : ((s === '♥' || s === '♦') ? '#C42B38' : '#17191B');
    const mk = (r, s) => ({ r, s, color: col(s) });
    const t = (tag, act) => ({ hasTag: true, tag, tagBg: act ? '#E6B85C' : '#3A3A3A', tagFg: act ? '#1A1408' : '#D4D4D4' });
    return {
      felt: f[1], feltHi: f[0],
      board: [mk('K', '♥'), mk('9', '♣'), mk('4', '♦'), mk('2', '♠')],
      h1: mk('A', '♠'), h2: mk('K', '♦'),
      seats: [
        { name: 'Priya', ini: 'PR', stack: 260, x: 4, y: 74, hue: '#C9A7E0', cls: 'folded', ...t('D') },
        { name: 'Kim', ini: 'KI', stack: 223, x: 2, y: 45, hue: '#8FD0CF', cls: 'folded', ...t('SB') },
        { name: 'Leo', ini: 'LE', stack: 207, x: 12, y: 16, hue: '#A7B8E8', cls: '', ...t('Check') },
        { name: 'Maya', ini: 'MA', stack: 612, x: 50, y: 2, hue: '#E9B872', cls: 'folded', hasTag: false },
        { name: 'Dev', ini: 'DE', stack: 34, x: 88, y: 16, hue: '#9CC5A1', cls: '', ...t('Bet 60', true) },
        { name: 'Ari', ini: 'AR', stack: 371, x: 98, y: 45, hue: '#E8A3A3', cls: '', ...t('Call 60', true) },
        { name: 'Jonah', ini: 'JO', stack: 0, x: 96, y: 74, hue: '#D9C79A', cls: 'out', ...t('Away') }
      ]
    };
  }
}
</script>
</body>
</html>

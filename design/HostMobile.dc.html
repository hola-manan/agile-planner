<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Felt — Host tools (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#262626}
.app{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#ECE8DF;background:#262626}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:#ABABAB}
.panel{background:#303030;border:1px solid #3D3D3D;border-radius:18px}
.btn{height:46px;padding:0 14px;border-radius:12px;border:1px solid #4A4A4A;background:#383838;color:#ECE8DF;font:700 15px 'Bricolage Grotesque',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;text-decoration:none}
.btn.primary{background:#E6B85C;border-color:#E6B85C;color:#1A1408}
.btn.danger{border-color:#6E3A36;color:#F2A096;background:#3A2726}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#ABABAB;font-weight:600}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#14110C;flex:none}
.field{height:56px;border-radius:12px;border:1px solid #4A4A4A;background:#1F1F1F;color:#ECE8DF;padding:0 14px;font-size:22px;box-sizing:border-box;width:100%}
.seg{display:flex;padding:4px;gap:4px;background:#1F1F1F;border:1px solid #4A4A4A;border-radius:12px}
.seg button{flex:1;height:40px;border:0;border-radius:9px;background:transparent;color:#ABABAB;font:600 14px 'Bricolage Grotesque',sans-serif}
.seg button.on{background:#444444;color:#ECE8DF;box-shadow:inset 0 0 0 1px #E6B85C}
.chipbtn{height:36px;padding:0 12px;border-radius:999px;border:1px solid #4A4A4A;background:transparent;color:#D4D4D4;font:600 13px 'Bricolage Grotesque',sans-serif}
.chipbtn.on{border-color:#E6B85C;color:#E6B85C}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #3A3A3A}
</style>
</helmet>
<div class="app" style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <div style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; align-items: center; gap: 10px">
      <a class="btn" href="Mobile.dc.html" aria-label="Back to table" style="width: 44px; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 style="margin: 0; font-size: 24px; letter-spacing: -0.02em">Host tools</h1>
    </header>
    <div class="panel" style="padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <div class="av" style="background: #D9C79A">JO</div>
        <div style="flex: 1"><div style="font-weight: 600">Jonah wants to rebuy</div><div class="muted" style="font-size: 13px">2nd buy-in</div></div>
        <span class="mono" style="font-weight: 700; color: #E6B85C; font-size: 17px">200</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button class="btn danger">Deny</button><button class="btn primary">Approve</button></div>
    </div>
    <div class="panel" style="padding: 6px 14px">
      <sc-for list="{{players}}" as="p" hint-placeholder-count="5">
        <div class="prow">
          <div class="av" style="background: {{p.hue}}">{{p.ini}}</div>
          <span style="flex: 1; font-weight: 600">{{p.name}}</span>
          <span class="mono" style="color: #E6B85C">{{p.stack}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(4,6,5,.7)"></div>

  <form style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 26px 26px 0 0; padding: 12px 16px 24px; background: #2E2E2E; border-top: 1px solid #E6B85C; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -20px 50px rgba(0,0,0,.6)">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #555555; align-self: center"></div>
    <div style="display: flex; align-items: center; gap: 12px">
      <div class="av" style="background: #E9B872; width: 44px; height: 44px">MA</div>
      <div style="flex: 1"><div style="font-weight: 700; font-size: 19px">Adjust Maya's chips</div><div class="muted" style="font-size: 14px">Stack <span class="mono" style="color: #ECE8DF">612</span></div></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" class="btn" style="height: 42px">Set away</button>
      <button type="button" class="btn danger" style="height: 42px">Remove from seat</button>
    </div>
    <div class="seg"><button type="button" class="on" aria-pressed="true">Add</button><button type="button">Remove</button><button type="button">Set to</button></div>
    <div style="display: flex; gap: 10px; align-items: center">
      <input aria-label="Amount" class="field mono" defaultValue="50" style="flex: 1">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
        <span class="mono muted">612</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ABABAB" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        <span class="mono" style="font-size: 22px; font-weight: 700; color: #E6B85C">662</span>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <button type="button" class="chipbtn on" aria-pressed="true">Cash rebuy</button>
      <button type="button" class="chipbtn">Miscount fix</button>
      <button type="button" class="chipbtn">Move from player</button>
      <button type="button" class="chipbtn">Bounty</button>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="checkbox" defaultChecked="{{true}}" style="accent-color: #E6B85C; width: 20px; height: 20px; margin: 0">Count as a buy-in on the ledger</label>
    <div style="font-size: 13px; color: #F4D28E; padding: 10px 12px; border-radius: 10px; background: #3A3528">Applies when hand #42 ends.</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" class="btn">Cancel</button>
      <button type="submit" class="btn primary">Add 50 chips</button>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      players: [
        { name: 'Maya', ini: 'MA', hue: '#E9B872', stack: 612 },
        { name: 'Ari', ini: 'AR', hue: '#E8A3A3', stack: 455 },
        { name: 'Priya', ini: 'PR', hue: '#C9A7E0', stack: 260 },
        { name: 'Kim', ini: 'KI', hue: '#8FD0CF', stack: 224 },
        { name: 'Leo · away', ini: 'LE', hue: '#A7B8E8', stack: 231 }
      ]
    };
  }
}
</script>
</body>
</html>

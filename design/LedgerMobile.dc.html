<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Felt — Ledger (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#262626}
a{color:#E6B85C}
.app{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#ECE8DF;background:#262626}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:#ABABAB}
.panel{background:#303030;border:1px solid #3D3D3D;border-radius:18px}
.btn{height:44px;padding:0 14px;border-radius:12px;border:1px solid #4A4A4A;background:#383838;color:#ECE8DF;font:700 14px 'Bricolage Grotesque',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;text-decoration:none}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#ABABAB;font-weight:600}
.tile{padding:14px;display:flex;flex-direction:column;gap:4px}
.tile .v{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#14110C;flex:none}
.prow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #3A3A3A}
.pay{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #3A3A3A;font-size:15px}
.pay input{accent-color:#E6B85C;width:22px;height:22px;margin:0}
</style>
</helmet>
<div class="app" style="width: 390px; min-height: 1420px; padding: 16px 16px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
  <header style="display: flex; align-items: center; gap: 10px">
    <a class="btn" href="Mobile.dc.html" aria-label="Back to table" style="width: 44px; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1">
      <h1 style="margin: 0; font-size: 24px; letter-spacing: -0.02em">Ledger</h1>
      <div class="muted" style="font-size: 13px">After hand #41 · 2h 48m</div>
    </div>
    <button class="btn" aria-label="Export or share" style="width: 44px; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 14v6h14v-6"></path></svg></button>
  </header>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div class="panel tile"><span class="label">Bought in</span><span class="v">2,400</span></div>
    <div class="panel tile"><span class="label">On table</span><span class="v">2,400</span><span style="font-size: 12px; color: #8FE0AF">Balanced</span></div>
  </div>

  <div class="panel" style="padding: 6px 14px">
    <sc-for list="{{rows}}" as="p" hint-placeholder-count="8">
      <div class="prow" style="border-top: {{p.border}}">
        <div class="av" style="background: {{p.hue}}">{{p.ini}}</div>
        <div style="flex: 1; min-width: 0">
          <div style="font-weight: 600">{{p.name}}</div>
          <div class="muted mono" style="font-size: 12px">in {{p.buy}} · stack {{p.stack}}</div>
        </div>
        <div style="width: 64px; height: 6px; border-radius: 3px; background: #383838; position: relative">
          <div style="position: absolute; top: 0; bottom: 0; left: {{p.barL}}%; width: {{p.barW}}%; background: {{p.barColor}}; border-radius: 3px"></div>
        </div>
        <span class="mono" style="width: 52px; text-align: right; font-weight: 700; color: {{p.netColor}}">{{p.net}}</span>
      </div>
    </sc-for>
  </div>

  <div class="panel" style="padding: 16px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-weight: 700; font-size: 18px">Settle up</span>
      <span class="muted" style="font-size: 13px">1 of 6 paid</span>
    </div>
    <div style="margin-top: 8px">
      <sc-for list="{{pays}}" as="t" hint-placeholder-count="6">
        <label class="pay">
          <input type="checkbox" defaultChecked="{{t.done}}">
          <span style="flex: 1; {{t.style}}"><b>{{t.from}}</b> <span class="muted">→</span> <b>{{t.to}}</b></span>
          <span class="mono" style="font-weight: 700; color: #E6B85C">{{t.amt}}</span>
        </label>
      </sc-for>
    </div>
  </div>

  <div class="panel" style="padding: 16px">
    <div style="font-weight: 700; font-size: 18px; margin-bottom: 4px">Activity</div>
    <sc-for list="{{events}}" as="e" hint-placeholder-count="3">
      <div style="display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid #3A3A3A; font-size: 14px; line-height: 1.4"><span class="mono muted">{{e.t}}</span><span>{{e.text}}</span></div>
    </sc-for>
    <a href="#" style="display: inline-block; margin-top: 8px; font-weight: 600; font-size: 14px; padding: 8px 0">Full history</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1420}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Maya', 'MA', '#E9B872', 400, 612], ['Ari', 'AR', '#E8A3A3', 300, 455],
      ['Priya', 'PR', '#C9A7E0', 200, 260], ['Kim', 'KI', '#8FD0CF', 200, 224],
      ['You', 'YO', '#F2D9A0', 500, 500], ['Dev', 'DE', '#9CC5A1', 200, 118],
      ['Leo', 'LE', '#A7B8E8', 400, 231], ['Jonah', 'JO', '#D9C79A', 200, 0]
    ];
    const rows = data.map(([name, ini, hue, buy, stack], i) => {
      const n = stack - buy, w = Math.abs(n) / 220 * 50;
      return {
        name, ini, hue, buy, stack, border: i === 0 ? '0' : '1px solid #3A3A3A',
        net: n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0',
        netColor: n > 0 ? '#8FE0AF' : n < 0 ? '#F2A096' : '#D4D4D4',
        barL: n >= 0 ? 50 : 50 - w, barW: Math.max(w, 1), barColor: n > 0 ? '#5BC98A' : n < 0 ? '#E0705F' : '#555555'
      };
    });
    const pay = (from, to, amt, done) => ({ from, to, amt, done: !!done, style: done ? 'text-decoration: line-through; opacity: .55' : '' });
    return {
      rows,
      pays: [pay('Jonah', 'Maya', 200, true), pay('Leo', 'Ari', 155), pay('Leo', 'Maya', 12), pay('Leo', 'Kim', 2), pay('Dev', 'Priya', 60), pay('Dev', 'Kim', 22)],
      events: [
        { t: '22:41', text: 'Host approved Ari’s rebuy of 100' },
        { t: '22:30', text: 'Host moved 20 from Leo to Kim · miscounted pot' },
        { t: '22:12', text: 'Host approved Maya’s rebuy of 200' }
      ]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Felt — Showdown on the table (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#262626}
.app{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#ECE8DF;background:#262626}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:#ABABAB}
.btn{height:50px;border-radius:14px;border:1px solid #4A4A4A;background:#383838;color:#ECE8DF;font:700 15px 'Bricolage Grotesque',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.btn.primary{background:#E6B85C;border-color:#E6B85C;color:#1A1408}
.card{background:#F6F2E9;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;font-weight:700;line-height:1;font-variant-emoji:text}
.card .su{align-self:flex-end;font-size:1.3em}
.card.bd{width:34px;height:48px;padding:4px 5px;font-size:14px;border-radius:5px}
.card.rv{width:30px;height:42px;padding:3px 4px;font-size:13px;border-radius:5px;animation:flip .55s ease-out both}
.card.xl{width:66px;height:92px;padding:7px 8px;font-size:26px;border-radius:9px}
@keyframes flip{0%{transform:perspective(400px) rotateY(90deg) scale(.7)}100%{transform:perspective(400px) rotateY(0) scale(1)}}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2}
.pod{display:flex;flex-direction:column;align-items:center;padding:5px 8px;background:#333333;border:1px solid #4A4A4A;border-radius:12px;min-width:58px}
.pod.folded{opacity:.45}.pod.out{opacity:.55;border-style:dashed}
.pod.win{border-color:#E6B85C;box-shadow:0 0 0 3px rgba(230,184,92,.25)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11px;color:#14110C;margin-top:-16px;border:2px solid #333333}
</style>
</helmet>
<div class="app" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px">
    <button class="btn" aria-label="Menu" style="width: 44px; height: 44px; background: transparent; border-color: transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <div style="text-align: center">
      <div style="font-weight: 700; font-size: 15px">Friday Night Game</div>
      <div class="muted" style="font-size: 12px">Hand <span class="mono">#43</span> · Showdown</div>
    </div>
    <span class="mono" style="width: 44px; text-align: center; font-weight: 700">6s</span>
  </header>

  <div style="flex: 1; padding: 40px 40px 60px; position: relative">
    <div style="position: relative; height: 100%; border-radius: 999px; background: #1C1C1C; padding: 10px; box-sizing: border-box">
      <div style="position: relative; width: 100%; height: 100%; border-radius: 999px; background: radial-gradient(ellipse at 50% 40%, #3DAA6E 0%, #1F8549 75%); box-shadow: inset 0 0 0 2px rgba(255,255,255,.14)">
        <div style="position: absolute; left: 50%; top: 47%; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; gap: 8px">
          <span style="padding: 3px 10px; border-radius: 999px; background: rgba(0,0,0,.3); font-size: 12px; white-space: nowrap">Pot <b class="mono" style="color: #F4D28E">910</b> · ran twice</span>
          <sc-for list="{{runs}}" as="run" hint-placeholder-count="2">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
              <div style="display: flex; gap: 3px">
                <sc-for list="{{run.cards}}" as="c" hint-placeholder-count="5">
                  <div class="card bd" style="color: {{c.color}}; opacity: {{c.op}}; {{c.lift}}"><span>{{c.r}}</span><span class="su">{{c.s}}</span></div>
                </sc-for>
              </div>
              <span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #E6B85C; color: #1A1408">{{run.label}}</span>
            </div>
          </sc-for>
        </div>
        <sc-for list="{{seats}}" as="p" hint-placeholder-count="7">
          <div class="seat" style="left: {{p.x}}%; top: {{p.y}}%">
            <sc-if value="{{p.shown}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; gap: 2px; margin-bottom: 8px">
                <sc-for list="{{p.cards}}" as="c" hint-placeholder-count="2">
                  <div class="card rv" style="color: {{c.color}}"><span>{{c.r}}</span><span class="su">{{c.s}}</span></div>
                </sc-for>
              </div>
            </sc-if>
            <div class="pod {{p.cls}}">
              <div class="av" style="background: {{p.hue}}">{{p.ini}}</div>
              <span style="font-size: 12px; font-weight: 600">{{p.name}}</span>
              <span class="mono" style="font-size: 12px; color: #E6B85C">{{p.stack}}</span>
            </div>
            <sc-if value="{{p.hasTag}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: #E6B85C; color: #1A1408; white-space: nowrap">{{p.tag}}</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 8px">
      <div class="card xl" style="color: {{j1}}; transform: rotate(-5deg); outline: 3px solid #E6B85C; outline-offset: 2px"><span>J</span><span class="su">♠</span></div>
      <div class="card xl" style="color: {{j2}}; transform: rotate(5deg); opacity: .6"><span>J</span><span class="su">♣</span></div>
    </div>
  </div>

  <div style="padding: 14px 16px 20px; background: #303030; border-top: 1px solid #3D3D3D; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-weight: 700; font-size: 16px">Show your hand?</span>
      <span class="muted" style="font-size: 12px">Anyone can show · even after folding</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button class="btn" style="background: transparent">Hide</button>
      <button class="btn">Both</button>
      <button class="btn primary">J♠ only</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fourColor":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const four = this.props.fourColor ?? true;
    const fc = { '♠': '#17191B', '♥': '#C42B38', '♦': '#1E5BC6', '♣': '#1B7F45' };
    const col = (s) => four ? fc[s] : ((s === '♥' || s === '♦') ? '#C42B38' : '#17191B');
    const mk = (r, s, used) => ({ r, s, color: col(s), op: used === false ? 0.4 : 1, lift: used ? 'transform: translateY(-3px)' : '' });
    const base = { shown: false, cards: [], hasTag: false, tag: '' };
    return {
      j1: col('♠'), j2: col('♣'),
      runs: [
        { label: 'Run 1 · Maya, flush', cards: [mk('Q', '♠', false), mk('8', '♥', true), mk('3', '♥', true), mk('J', '♥', true), mk('2', '♣', false)] },
        { label: 'Run 2 · Ari, trips', cards: [mk('Q', '♠', true), mk('8', '♥', true), mk('3', '♥', false), mk('7', '♦', false), mk('Q', '♦', true)] }
      ],
      seats: [
        { ...base, name: 'Priya', ini: 'PR', stack: 260, x: 4, y: 76, hue: '#C9A7E0', cls: 'folded', shown: true, cards: [mk('7', '♣'), mk('2', '♦')] },
        { ...base, name: 'Kim', ini: 'KI', stack: 222, x: 2, y: 47, hue: '#8FD0CF', cls: 'folded' },
        { ...base, name: 'Leo', ini: 'LE', stack: 205, x: 12, y: 16, hue: '#A7B8E8', cls: 'folded', shown: true, cards: [mk('9', '♦'), mk('9', '♠')] },
        { ...base, name: 'Maya', ini: 'MA', stack: 455, x: 50, y: 3, hue: '#E9B872', cls: 'win', shown: true, cards: [mk('A', '♥'), mk('5', '♥')], hasTag: true, tag: '+455' },
        { ...base, name: 'Dev', ini: 'DE', stack: 118, x: 88, y: 16, hue: '#9CC5A1', cls: 'folded' },
        { ...base, name: 'Ari', ini: 'AR', stack: 826, x: 96, y: 47, hue: '#E8A3A3', cls: 'win', shown: true, cards: [mk('Q', '♣'), mk('10', '♣')], hasTag: true, tag: '+455' },
        { ...base, name: 'Jonah', ini: 'JO', stack: 0, x: 96, y: 76, hue: '#D9C79A', cls: 'out' }
      ]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Felt — table preview</title>
  <meta name="theme-color" content="#262626">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500;700&display=swap">
  <style>
    .pv-index { max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #ECE8DF; }
    .pv-index h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0 0 6px; }
    .pv-index p { color: #ABABAB; margin: 0 0 22px; line-height: 1.5; }
    .pv-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .pv-item { background: #303030; border: 1px solid #3D3D3D; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
    .pv-item b { font-size: 16px; }
    .pv-item span { color: #ABABAB; font-size: 13px; line-height: 1.4; flex: 1; }
    .pv-links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; font-weight: 600; }
    .pv-frame-wrap { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; gap: 24px; padding: 24px; background: #1a1a1a; }
    .pv-frame { width: 390px; height: 844px; border: 0; border-radius: 36px; box-shadow: 0 0 0 10px #0d0d0d, 0 30px 80px rgba(0,0,0,.6); background: #262626; }
    .pv-bar { position: fixed; z-index: 1000; right: 10px; bottom: 10px; display: flex; gap: 6px; font: 600 12px 'Bricolage Grotesque', system-ui, sans-serif; opacity: .35; transition: opacity .15s; }
    .pv-bar:hover { opacity: 1; }
    .pv-bar a, .pv-bar span { background: #111; color: #E6B85C; padding: 6px 10px; border-radius: 999px; text-decoration: none; }
    .pv-err { margin: 40px auto; max-width: 640px; padding: 20px; border-radius: 14px; background: #3A2726; color: #F2A096; font: 14px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  </style>
  <script>
    // Boot: pick asset paths for the server we're on, stub missing UI modules via an import map,
    // then load the preview module.
    //   repo-root server (http-server . -p 8790):  /dev/preview.html  → app files at /public/…
    //   dev server (npm run dev):                    /__dev/preview.html → app files at /…
    (function () {
      var q = new URLSearchParams(location.search);
      var devServer = location.pathname.indexOf('/__dev/') === 0;
      var PUB = devServer ? '/' : '/public/';
      var DEV = devServer ? '/__dev/' : '/dev/';
      window.FELT_NO_MOUNT = true;
      window.FELT_PREVIEW = { PUB: PUB, DEV: DEV };

      ['css/base.css', 'css/table.css', 'css/panels.css', 'css/lobby.css'].forEach(function (href) {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = PUB + href;
        document.head.appendChild(l);
      });

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.async = false;
          s.onload = resolve;
          s.onerror = function () { reject(new Error('failed to load ' + src)); };
          document.head.appendChild(s);
        });
      }

      var MODS = ['table', 'actionbar', 'side', 'host', 'ledger'];
      var force = (q.get('stubs') || '').split(',').filter(Boolean);
      var checks = MODS.map(function (m) {
        if (force.indexOf('all') >= 0 || force.indexOf(m) >= 0) return Promise.resolve([m, false]);
        return fetch(PUB + 'js/' + m + '.js', { method: 'HEAD', cache: 'no-store' })
          .then(function (r) { return [m, r.ok]; })
          .catch(function () { return [m, false]; });
      });

      Promise.all([
        loadScript(PUB + 'vendor/react.js').then(function () { return loadScript(PUB + 'vendor/react-dom.js'); }).then(function () { return loadScript(PUB + 'vendor/htm.js'); }),
        Promise.all(checks),
      ]).then(function (res) {
        var imports = {}; imports[DEV + 'fixtures/index.js'] = DEV + 'fixtures-table/index.js';
        if (devServer) imports['/public/js/'] = '/js/'; // stubs import ../../public/js/… — keep ONE copy of each module
        var stubbed = [];
        res[1].forEach(function (r) {
          if (!r[1]) {
            imports[PUB + 'js/' + r[0] + '.js'] = DEV + 'stubs/' + r[0] + '.js';
            stubbed.push(r[0]);
          }
        });
        window.FELT_PREVIEW.stubbed = stubbed;
        var im = document.createElement('script');
        im.type = 'importmap';
        im.textContent = JSON.stringify({ imports: imports });
        document.head.appendChild(im);
        var m = document.createElement('script');
        m.type = 'module';
        m.src = DEV + 'preview.js';
        document.head.appendChild(m);
      }).catch(function (err) {
        document.body.innerHTML = '<div class="pv-err">' + String(err && err.stack || err) + '</div>';
      });
    })();
  </script>
</head>
<body style="margin:0;background:#262626">
  <div id="preview-root"></div>
</body>
</html>

        }

        // ============================================================
        // SPRINT TAB
        // ============================================================
        function renderSprintTab() {
            var el = document.getElementById('tab-sprint');
            // Sprints are global; we no longer require a current project to view them.
            ensureSprintsAP();
            var sprint = getActiveSprintAP();
            if (sprint && sprint.id !== activeSprintId) {
                activeSprintId = sprint.id;
                saveLocal();
            }

            if (!sprint) {
                el.innerHTML =
                    '<div class="empty-hero">' +
                    '<h3>No sprint <em>yet.</em></h3>' +
                    '<p>A sprint time-boxes a slice of work — typically two weeks. Once you start one, this view turns into a board where you can drag issues from To do → In progress → Done and watch a burndown chart unfold.</p>' +
                    '<div class="actions">' +
                    '<button class="btn primary" onclick="openSprintEditor(null,true)">+ Create first sprint</button>' +
                    '<button class="btn" onclick="setTab(\'backlog\')">View backlog</button>' +
                    '</div>' +
                    '</div>';
                return;
            }

            var sprintIssues = issues.filter(function (s) { return s.sprintId === sprint.id });
            var totalPts = sprintIssues.reduce(function (a, s) { return a + issueEstBlocks(s) }, 0);
            var donePts = sprintIssues.filter(function (s) { return s.status === 'done' })
                .reduce(function (a, s) { return a + issueEstBlocks(s) }, 0);
            var pct = totalPts ? Math.round(100 * donePts / totalPts) : 0;
            var totalActual = sprintIssues.reduce(function (a, s) { return a + issueActualBlocks(s) }, 0);
            var today = todayISO();
            var totalDays = Math.max(1, daysBetween(sprint.startDate, sprint.endDate) + 1);
            var elapsed = clamp(daysBetween(sprint.startDate, today) + 1, 0, totalDays);
            var remaining = Math.max(0, totalDays - elapsed);

            var statuses = [
                { k: 'todo', label: 'To Do' },
                { k: 'in-progress', label: 'In Progress' },
                { k: 'review', label: 'Review' },
                { k: 'done', label: 'Done' }
            ];
            var byStatus = {};
            statuses.forEach(function (s) { byStatus[s.k] = [] });
            sprintIssues.forEach(function (s) {
                var k = s.status || 'todo';
                if (!byStatus[k]) byStatus[k] = [];
                byStatus[k].push(s);
            });
            statuses.forEach(function (st) {
                byStatus[st.k].sort(function (a, b) {
                    return (a.priority || 3) - (b.priority || 3) || (a.order || 0) - (b.order || 0);
                });
            });

            var html = '';
            html += '<div class="card sprint-hero">';
            html += '<div class="row" style="justify-content:space-between;align-items:flex-start;margin-bottom:6px">';
            html += '<div style="flex:1;min-width:0">';
            html += '<div class="sprint-crumb"><span class="day">Day ' + elapsed + ' / ' + totalDays + '</span><span class="sep">•</span>' + fmtDate(sprint.startDate) + ' → ' + fmtDate(sprint.endDate) + '</div>';
            html += '<div class="name">' + escHtml(sprint.name || 'Untitled sprint') + '</div>';
            if (sprint.goal) html += '<div class="goal">' + escHtml(sprint.goal) + '</div>';
            html += '</div>';
            html += '<div class="row-tight">';
            html += '<button class="btn ghost icon" title="Edit" onclick="openSprintEditor(\'' + sprint.id + '\',false)">&#9998;</button>';
            html += sprintStatusButton(sprint);
            html += '</div></div>';

            html += '<div class="stats" style="grid-template-columns: repeat(4, 1fr) !important">';
            html += '<div class="stat-tile"><div class="v">' + fmtHours(donePts) + '/' + fmtHours(totalPts) + '</div><div class="l">Hours est</div></div>';
            html += '<div class="stat-tile"><div class="v">' + fmtHours(totalActual) + '</div><div class="l">Logged</div></div>';
            html += '<div class="stat-tile"><div class="v">' + sprintIssues.length + '</div><div class="l">Issues</div></div>';
            html += '<div class="stat-tile"><div class="v">' + pct + '<span style="font-size:11px;color:var(--ui-text-dim)">%</span></div><div class="l">Done</div></div>';
            html += '</div>';

            if (sprint.capacityBlocks) {
                var capPct = sprint.capacityBlocks ? Math.round(100 * totalPts / sprint.capacityBlocks) : 0;
                html += '<div class="row" style="font-family:\'JetBrains Mono\',ui-monospace,monospace;font-size:11px;color:var(--ui-text-soft);justify-content:flex-end;margin-top:4px"><span>Capacity · ' + fmtHours(totalPts) + ' / ' + fmtHours(sprint.capacityBlocks) + ' (' + capPct + '%)</span></div>';
            }
            html += '<div class="progress-bar" style="margin-top:8px"><div style="width:' + pct + '%"></div></div>';
            html += '</div>';

            html += '<div class="card">';
            html += '<div class="section-head">Burndown</div>';
            html += '<div class="chart-wrap"><canvas id="burndown-canvas"></canvas></div>';
            html += '</div>';

            html += '<div class="quick-add">';
            html += '<span class="hint">NEW ISSUE</span>';
            html += '<input id="sprint-quick-add" type="text" placeholder="Title — e.g. \'Refactor scoring · P2 · 2h\'" onkeydown="if(event.key===\'Enter\'){quickAddIssue(\'sprint\')}">';
            html += '<button class="btn primary sm" onclick="quickAddIssue(\'sprint\')">Add →</button>';
            html += '</div>';

            html += '<div class="choice-row" style="margin-bottom:10px">';
            html += filterPill('', 'All', sprintFilterStatus, 'sprintFilterStatus');
            statuses.forEach(function (st) {
                html += filterPill(st.k, st.label + ' (' + byStatus[st.k].length + ')', sprintFilterStatus, 'sprintFilterStatus');
            });
            html += '</div>';

            if (!sprintIssues.length) {
                html += '<div class="card"><div class="empty">No issues in this sprint yet. Pull some from the Backlog →</div></div>';
            } else {
                html += '<div class="board-grid">';
                statuses.forEach(function (st) {
                    if (sprintFilterStatus && sprintFilterStatus !== st.k) return;
                    var list = byStatus[st.k];
                    if (!list.length && sprintFilterStatus !== st.k) return;
                    var stPts = list.reduce(function (a, s) { return a + issueEstBlocks(s) }, 0);
                    html += '<div class="status-group">';
                    html += '<div class="status-group-head">';
                    html += '<span class="label">' + st.label + ' &middot; ' + list.length + '</span>';
                    html += '<span class="pts">' + fmtHours(stPts) + ' est</span>';
                    html += '</div>';
                    if (!list.length) {
                        html += '<div class="empty" style="padding:10px">&mdash;</div>';
                    } else {
                        // Group by project so cross-project sprints stay readable.
                        var byProj = {};
                        list.forEach(function (it) {
                            var pid = it.projectId || '__none__';
                            if (!byProj[pid]) byProj[pid] = [];
                            byProj[pid].push(it);
                        });
                        var projIds = Object.keys(byProj).sort(function (a, b) {
                            var pa = projects.find(function (p) { return p.id === a; });
                            var pb = projects.find(function (p) { return p.id === b; });
                            return (pa ? pa.name : 'zzz').localeCompare(pb ? pb.name : 'zzz');
                        });
                        projIds.forEach(function (pid) {
                            var p = projects.find(function (x) { return x.id === pid; });
                            var pname = p ? p.name : '(no project)';
                            var pcolor = p ? p.color : 'var(--ui-text-dim)';
                            html += '<div class="proj-subgroup" style="margin-bottom:8px">';
                            html += '<div style="font-family:\'JetBrains Mono\',ui-monospace,monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ui-text-dim);margin:6px 0 4px;display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:2px;background:' + pcolor + '"></span>' + escHtml(pname) + '</div>';
                            byProj[pid].forEach(function (s) { html += renderIssueCard(s, true); });
                            html += '</div>';
                        });
                    }
                    html += '</div>';
                });
                html += '</div>'; // close .board-grid
            }

            el.innerHTML = html;
            drawBurndown(sprint, sprintIssues);
        }

        function filterPill(k, label, current, varName) {
            var active = (current === k) ? ' active' : '';
            return '<button class="choice-btn' + active + '" onclick="setFilter(\'' + varName + '\',\'' + k + '\')">' +
                escHtml(label) + '</button>';
        }
        function setFilter(varName, val) { window[varName] = val; renderAll(); }

        function sprintStatusButton(sprint) {
            if (sprint.status === 'planning') {
                return '<button class="btn primary sm" onclick="startSprint(\'' + sprint.id + '\')">Start sprint</button>';
            } else if (sprint.status === 'active') {
                return '<button class="btn sm" onclick="completeSprint(\'' + sprint.id + '\')">Complete</button>';
            }
            return '<span class="pill sprint-completed">Completed</span>';
        }

        function startSprint(id) {
            var s = sprints.find(function (x) { return x.id === id });
            if (!s) return;
            s.status = 'active';
            s.updatedAt = Date.now();
            activeSprintId = id;
            markUpdated(); renderAll();
            showToast('Sprint started');
        }

        function completeSprint(id) {
            var s = sprints.find(function (x) { return x.id === id });
            if (!s) return;
            var inSprint = issues.filter(function (it) { return it.sprintId === id });
            var incomplete = inSprint.filter(function (it) { return it.status !== 'done' });
            var msg = 'Complete this sprint?';
            if (incomplete.length) {
                msg += '\n\n' + incomplete.length + ' incomplete issue' + (incomplete.length === 1 ? '' : 's') +
                    ' will return to the backlog (per project).';
            }
            if (!confirm(msg)) return;
            incomplete.forEach(function (it) { it.sprintId = null; it.updatedAt = Date.now(); });
            s.status = 'completed';
            s.completedAt = Date.now();
            s.updatedAt = Date.now();
            if (activeSprintId === id) {
                var nextActive = sprints.find(function (x) { return x.status === 'active' && x.id !== id }) ||
                    sprints.filter(function (x) { return x.number > s.number; }).sort(function (a, b) { return a.number - b.number; })[0];
                activeSprintId = nextActive ? nextActive.id : null;
            }
            markUpdated(); renderAll();
            showToast('Sprint completed');
        }

        // ============================================================
        // ISSUE CARDS
        // ============================================================
        function renderIssueCard(it, inSprintView) {
            var fe = it.featureId ? features.find(function (f) { return f.id === it.featureId }) : null;
            var sprint = it.sprintId ? sprints.find(function (sp) { return sp.id === it.sprintId }) : null;
            var tasks = Array.isArray(it.tasks) ? it.tasks : [];
            var taskDone = tasks.filter(function (x) { return x.done }).length;
            var actualBlocks = issueActualBlocks(it);
            var expanded = expandedIssueIds[it.id];

            var html = '<div class="issue-card status-' + (it.status || 'todo') + (expanded ? ' expanded' : '') + '" data-id="' + it.id + '">';

            html += '<div class="head" onclick="toggleIssue(\'' + it.id + '\')">';
            html += '<div class="body">';
            html += '<div class="issue-title">' + escHtml(it.title || '(untitled)') + '</div>';
            html += '<div class="issue-meta">';
            if (it.type && it.type !== 'story') html += '<span class="pill type-' + it.type + '">' + typeLabel(it.type) + '</span>';
            var estBlocks = issueEstBlocks(it);
            if (estBlocks) html += '<span class="pill points">' + fmtHours(estBlocks) + ' est</span>';
            html += '<span class="pill prio-' + (it.priority || 3) + '">' + priorityLabel(it.priority) + '</span>';
            if (fe) html += '<span class="pill feature" style="color:' + (fe.color || 'var(--ui-info)') + '">' + escHtml(fe.title) + '</span>';
            if (sprint && !inSprintView) html += '<span class="pill">' + escHtml(sprint.name) + '</span>';
            if (tasks.length) html += '<span class="pill">' + taskDone + '/' + tasks.length + ' tasks</span>';
            if (actualBlocks) html += '<span class="pill time">' + fmtHours(actualBlocks) + ' logged</span>';
            if (it.status && it.status !== 'todo') html += '<span class="pill status-' + it.status + '">' + statusLabel(it.status) + '</span>';
            html += '</div></div>';
            html += '<div class="toggle">&#9656;</div>';
            html += '</div>';

            html += '<div class="issue-body" onclick="event.stopPropagation()">';
            if (it.description) {
                html += '<div class="field-label">Description</div>';
                html += '<div class="desc-text">' + escHtml(it.description) + '</div>';
            }
            if (it.acceptance) {
                html += '<div class="field-label">Acceptance criteria</div>';
                html += '<div class="desc-text">' + escHtml(it.acceptance) + '</div>';
            }
            html += '<div class="field-label">Tasks</div>';
            html += '<div id="tasks-' + it.id + '">';
            if (!tasks.length) html += '<div class="empty" style="padding:6px 0">No tasks</div>';
            else tasks.forEach(function (t) {
                var mapStr = '';
                if (t.blocks) mapStr += fmtHours(t.blocks) + ' est (' + t.blocks + ' blocks)';
                var noteStr = formatNotesSnippet(t.notes);
                
                html += '<div class="task-item">';
                html += '<div class="task-check' + (t.done ? ' done' : '') + '" onclick="toggleTask(\'' + it.id + '\',\'' + t.id + '\')">' + (t.done ? '&#10004;' : '') + '</div>';
                html += '<div class="task-info"><div class="task-title' + (t.done ? ' done' : '') + '">' + escHtml(t.title) + '</div>' + (mapStr ? '<div class="task-map">' + mapStr + '</div>' : '') + noteStr + '</div>';
                html += '<div class="task-actions"><button onclick="openTaskModal(\'' + it.id + '\', \'' + t.id + '\')" title="Edit">&#9998;</button><button onclick="deleteTask(\'' + it.id + '\',\'' + t.id + '\')" title="Delete">&#128465;</button></div>';
                html += '</div>';
            });
            html += '</div>';
            html += '<button class="btn" style="width:100%; margin-top:8px; border:1px solid var(--ui-border); background:var(--ui-bg-soft); color:var(--ui-text-soft);" onclick="openTaskModal(\'' + it.id + '\')">+ Add Task</button>';

            if (it.trackCat || it.trackSub) {
                html += '<div class="field-label">Time tracking link</div>';
                html += '<div style="font-size:12px;color:var(--ui-text-soft)">Override: ' +
                    'category = <b>' + escHtml(it.trackCat || '(project default)') + '</b>' +
                    (it.trackSub ? ', sub = <b>' + escHtml(it.trackSub) + '</b>' : '') +
                    ' &middot; <b>' + fmtHours(actualBlocks) + '</b> logged total</div>';
            }

            html += '<div class="row" style="margin-top:14px;justify-content:space-between">';
            html += '<div class="row-tight">' + statusButtons(it) + '</div>';
            html += '<div class="row-tight">';
            html += '<button class="btn ghost sm" onclick="openIssueEditor(\'' + it.id + '\')">Edit</button>';
            html += '<button class="btn ghost sm danger" onclick="deleteIssue(\'' + it.id + '\')">Delete</button>';
            html += '</div></div>';

            html += '</div></div>';
            return html;
        }

        function priorityLabel(p) {
            return ({ 1: 'P1 Critical', 2: 'P2 High', 3: 'P3 Medium', 4: 'P4 Low' })[p || 3];
        }
        function statusLabel(st) {
            return ({ 'todo': 'To Do', 'in-progress': 'In Progress', 'review': 'Review', 'done': 'Done' })[st || 'todo'];
        }
        function typeLabel(t) {
            return ({ 'story': 'Story', 'bug': 'Bug', 'chore': 'Chore' })[t || 'story'];
        }
        function statusButtons(it) {
            var statuses = [
                { k: 'todo', lab: 'To Do' },
                { k: 'in-progress', lab: 'Doing' },
                { k: 'review', lab: 'Review' },
                { k: 'done', lab: 'Done' }
            ];
            return statuses.map(function (st) {
                var active = (it.status || 'todo') === st.k ? ' primary' : '';
                return '<button class="btn sm' + active + '" onclick="setIssueStatus(\'' + it.id + '\',\'' + st.k + '\')">' +
                    st.lab + '</button>';
            }).join('');
        }

        function toggleIssue(id) {
            expandedIssueIds[id] = !expandedIssueIds[id];
            renderAll();
        }

        function setIssueStatus(id, status) {
            var it = issues.find(function (x) { return x.id === id }); if (!it) return;
            it.status = status; it.updatedAt = Date.now();
            if (status === 'done') it.completedAt = Date.now();
            else it.completedAt = null;
            markUpdated(); renderAll();
        }

        function deleteIssue(id) {
            if (!confirm('Delete this issue?')) return;
            issues = issues.filter(function (s) { return s.id !== id });
            if (plannerDeleted.issues.indexOf(id) === -1) plannerDeleted.issues.push(id);
            markUpdated(); renderAll();
            showToast('Issue deleted');
        }

        function toggleTask(issueId, tid) {
            var it = issues.find(function (x) { return x.id === issueId }); if (!it) return;
            var t = (it.tasks || []).find(function (x) { return x.id === tid }); if (!t) return;
            t.done = !t.done; it.updatedAt = Date.now();
            markUpdated(); renderAll();
        }
        function deleteTask(issueId, tid) {
            var it = issues.find(function (x) { return x.id === issueId }); if (!it) return;
            it.tasks = (it.tasks || []).filter(function (x) { return x.id !== tid });
            it.updatedAt = Date.now();
            markUpdated(); renderAll();
        }
        function issueEstBlocks(it) {
            if (!it) return 0;
            if (Array.isArray(it.tasks) && it.tasks.length) {
                var sum = it.tasks.reduce(function(a, t) { return a + (Number(t.blocks) || 0); }, 0);
                if (sum > 0) return sum;
            }
            return Number(it.estBlocks) || 0;
        }

        function changeTaskModalBlocks(d) {
            currentTaskModalBlocks = Math.max(0, Math.min(16, currentTaskModalBlocks + d));
            var el = document.getElementById('tm-blocks-val');
            if (el) el.textContent = currentTaskModalBlocks;
        }

        function openTaskModal(issueId, taskId) {
            var it = issues.find(function (x) { return x.id === issueId }); if (!it) return;
            var isNew = !taskId;
            var t = null;
            if (!isNew) {
                t = (it.tasks || []).find(function (x) { return x.id === taskId });
                if (!t) return;
            }
            
            currentTaskModalIssueId = issueId;
            currentTaskModalTaskId = isNew ? uid() : taskId;
            currentTaskModalBlocks = isNew ? 1 : (t.blocks || 0);
            
            var html = '<div class="modal" onclick="event.stopPropagation()" style="max-width:400px;">';
            html += '<div class="modal-head" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">';
            html += '<span style="font-weight:600; font-size:16px;">' + (isNew ? 'Add task' : 'Edit task') + '</span>';
            html += '<button class="btn sm ghost" onclick="closeModal()">Cancel</button>';
            html += '</div>';
            
            html += '<div class="field" style="margin-bottom:12px;">';
            html += '<input type="text" id="tm-title" placeholder="Task name..." value="' + (isNew ? '' : escHtml(t.title)) + '" onkeydown="if(event.key===\'Enter\')saveTaskModal()" style="width:100%">';
            html += '</div>';
            
            html += '<div class="field" style="margin-bottom:12px;"><label style="display:block; margin-bottom:4px; font-size:12px; color:var(--ui-text-soft);">Blocks (1 block = 0.5h)</label>';
            html += '<div class="block-picker" style="margin:0;">';
            html += '<button onclick="changeTaskModalBlocks(-1)">-</button>';
            html += '<span class="block-val" id="tm-blocks-val">' + currentTaskModalBlocks + '</span>';
            html += '<button onclick="changeTaskModalBlocks(1)">+</button>';
            html += '</div></div>';
            
            html += '<div class="field" style="margin-bottom:16px;"><label style="display:block; margin-bottom:4px; font-size:12px; color:var(--ui-text-soft);">Notes (optional)</label>';
            html += '<textarea id="tm-notes" placeholder="Task details or notes..." style="width:100%; min-height:60px;">' + (isNew ? '' : escHtml(t.notes || '')) + '</textarea></div>';
            
            html += '<button class="btn grow primary" style="width:100%; padding:10px; font-size:14px; font-weight:600;" onclick="saveTaskModal()">' + (isNew ? 'Add Task' : 'Save Task') + '</button>';
            html += '</div>';
            
            showModal(html);
        }

        function saveTaskModal() {
            var issueId = currentTaskModalIssueId;
            var taskId = currentTaskModalTaskId;
            if (!issueId || !taskId) return;
            
            var it = issues.find(function (x) { return x.id === issueId }); if (!it) return;
            
            var title = document.getElementById('tm-title').value.trim();
            if (!title) title = 'Task';
            var notes = document.getElementById('tm-notes').value.trim();
            var blocks = currentTaskModalBlocks;
            
            var t = (it.tasks || []).find(function(x) { return x.id === taskId });
            if (t) {
                // Edit
                t.title = title;
                t.notes = notes;
                t.blocks = blocks;
            } else {
                // Add
                if (!Array.isArray(it.tasks)) it.tasks = [];
                it.tasks.push({ id: taskId, title: title, done: false, blocks: blocks, notes: notes });
            }
            it.updatedAt = Date.now();
            markUpdated(); renderAll();
            closeModal();
        }

        window.toggleNotes = function (el) {
            var isExpanded = el.getAttribute('data-expanded') === 'true';
            var full = decodeURIComponent(el.getAttribute('data-full'));
            var short = decodeURIComponent(el.getAttribute('data-short'));
            if (isExpanded) {
                el.innerHTML = '“' + short + '” <a href="#" onclick="event.preventDefault(); window.toggleNotes(this.parentElement); event.stopPropagation();" style="color:var(--ui-accent);text-decoration:none;white-space:nowrap;">read more</a>';
                el.setAttribute('data-expanded', 'false');
            } else {
                el.innerHTML = '“' + full + '” <a href="#" onclick="event.preventDefault(); window.toggleNotes(this.parentElement); event.stopPropagation();" style="color:var(--ui-accent);text-decoration:none;white-space:nowrap;">show less</a>';
                el.setAttribute('data-expanded', 'true');
            }
        };

        function formatNotesSnippet(notesText, customClass) {
            if (!notesText) return '';
            var div = document.createElement('div');
            div.textContent = notesText;
            var escapedNotes = div.innerHTML.replace(/\n/g, '<br>');
            var cls = customClass || 's-notes';
            if (notesText.length <= 60) {
                return '<div class="' + cls + '">“' + escapedNotes + '”</div>';
            }
            var shortText = notesText.substring(0, 60).trim() + '...';
            div.textContent = shortText;
            var escapedShort = div.innerHTML;
            var safeFull = encodeURIComponent(escapedNotes);
            var safeShort = encodeURIComponent(escapedShort);
            var spanHtml = '<span data-expanded="false" data-full="' + safeFull + '" data-short="' + safeShort + '">“' + escapedShort + '” <a href="#" onclick="event.preventDefault(); window.toggleNotes(this.parentElement); event.stopPropagation();" style="color:var(--ui-accent);text-decoration:none;white-space:nowrap;">read more</a></span>';
            return '<div class="' + cls + '">' + spanHtml + '</div>';
        }

        // ============================================================
        // ISSUE EDITOR
        // ============================================================
        function openIssueEditor(id) {
            var proj = currentProject(); if (!proj) { showToast('Pick or create a project first', true); return; }
            var it = id ? issues.find(function (x) { return x.id === id }) : null;
            var isNew = !it;
            if (!it) it = createIssue({ projectId: proj.id });

            var projFeatures = features.filter(function (f) { return f.projectId === it.projectId });
            var projSprints = sprints.filter(function (sp) { return sp.projectId === it.projectId && sp.status !== 'completed' });

            var html = '<div class="modal">';
            html += '<h2>' + (isNew ? 'New issue' : 'Edit issue') + '</h2>';
            html += '<div class="field"><label>Title</label>';
            html += '<input id="ie-title" type="text" value="' + escHtml(it.title) + '"></div>';
            html += '<div class="field"><label>Description</label>';
            html += '<textarea id="ie-desc">' + escHtml(it.description || '') + '</textarea></div>';

            html += '<div class="row">';
            html += '<div class="field grow"><label>Type</label>';
            html += '<select id="ie-type">';
            [['story', 'Story'], ['bug', 'Bug'], ['chore', 'Chore']].forEach(function (p) {
                html += '<option value="' + p[0] + '"' + ((it.type || 'story') === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';

        // ----- Worktracker cat/sub dropdowns -----
        function addWtCategory(name) {
            name = (name || '').trim();
            if (!name) return false;
            if (!Array.isArray(wt.categoryOrder)) wt.categoryOrder = [];
            if (wt.categoryOrder.indexOf(name) === -1) wt.categoryOrder.push(name);
            if (!wt.categoryMeta || typeof wt.categoryMeta !== 'object') wt.categoryMeta = {};
            if (!wt.categoryMeta[name]) {
                var hues = [30, 340, 280, 120, 55, 195, 0, 310];
                var i = Object.keys(wt.categoryMeta).length % hues.length;
                wt.categoryMeta[name] = { hue: hues[i] };
            }
            if (!wt.sublists || typeof wt.sublists !== 'object') wt.sublists = {};
            if (!wt.sublists[name]) wt.sublists[name] = [];
            wtDirty = true;
            wt.updatedAt = Date.now();
            markUpdated();
            return true;
        }

        function addWtSublist(cat, sub) {
            cat = (cat || '').trim();
            sub = (sub || '').trim();
            if (!cat || !sub) return false;
            if (!wt.sublists || typeof wt.sublists !== 'object') wt.sublists = {};
            if (!wt.sublists[cat]) wt.sublists[cat] = [];
            if (wt.sublists[cat].indexOf(sub) === -1) wt.sublists[cat].push(sub);
            wtDirty = true;
            wt.updatedAt = Date.now();
            markUpdated();
            return true;
        }

        function populateTrackCatSelect(prefix, selectedVal) {
            var sel = document.getElementById(prefix + '-trackCat');
            if (!sel) return;
            var cats = (wt.categoryOrder && wt.categoryOrder.length)
                ? wt.categoryOrder.slice()
                : Object.keys(wt.categoryMeta || {});
            var emptyLabel = prefix === 'pr' ? '(pick a category)' : '(use project default)';
            sel.innerHTML = '';
            var blank = document.createElement('option');
            blank.value = ''; blank.textContent = emptyLabel;
            sel.appendChild(blank);
            cats.forEach(function (c) {
                var opt = document.createElement('option');
                opt.value = c; opt.textContent = c;
                if (c === selectedVal) opt.selected = true;
                sel.appendChild(opt);
            });
            var newOpt = document.createElement('option');
            newOpt.value = '__new__'; newOpt.textContent = '+ Add new category...';
            sel.appendChild(newOpt);
            if (!selectedVal) sel.value = '';
        }

        function populateTrackSubSelect(prefix, cat, selectedVal) {
            var sel = document.getElementById(prefix + '-trackSub');
            if (!sel) return;
            var subs = (cat && wt.sublists && wt.sublists[cat]) ? wt.sublists[cat].slice() : [];
            var emptyLabel = prefix === 'pr' ? '(pick a sub-list)' : '(any)';
            sel.innerHTML = '';
            var blank = document.createElement('option');
            blank.value = ''; blank.textContent = emptyLabel;
            sel.appendChild(blank);
            subs.forEach(function (s) {
                var opt = document.createElement('option');
                opt.value = s; opt.textContent = s;
                if (s === selectedVal) opt.selected = true;
                sel.appendChild(opt);
            });
            if (cat) {
                var newOpt = document.createElement('option');
                newOpt.value = '__new__'; newOpt.textContent = '+ Add new sub-list...';
                sel.appendChild(newOpt);
            }
            if (!selectedVal) sel.value = '';
        }

        function onTrackCatChange(prefix) {
            var sel = document.getElementById(prefix + '-trackCat');
            if (!sel) return;
            if (sel.value === '__new__') {
                var name = prompt('New category name:');
                if (name && name.trim()) {
                    var clean = name.trim();
                    addWtCategory(clean);
                    populateTrackCatSelect(prefix, clean);
                    populateTrackSubSelect(prefix, clean, '');
                    return;
                }
                sel.value = '';
            }
            populateTrackSubSelect(prefix, sel.value, '');
        }

        function onTrackSubChange(prefix) {
            var sel = document.getElementById(prefix + '-trackSub');
            if (!sel) return;
            if (sel.value === '__new__') {
                var catSel = document.getElementById(prefix + '-trackCat');
                var cat = catSel ? catSel.value : '';
                if (!cat || cat === '__new__') {
                    showToast('Pick a category first', true);
                    sel.value = '';
                    return;
                }
                var name = prompt('New sub-list name under "' + cat + '":');
                if (name && name.trim()) {
                    var clean = name.trim();
                    addWtSublist(cat, clean);
                    populateTrackSubSelect(prefix, cat, clean);
                    return;
                }
                sel.value = '';
            }
        }

        // ============================================================
        // QUICK ADD ISSUE — natural-language parser
        // Accepts: "Title · P2 · 2h · feature-name"
        //   - "P1" / "P2" / "P3" / "P4" (case-insensitive)
        //   - "1h", "1.5h", "30m"
        //   - Bare title remains the title
        // ============================================================
        function quickAddIssue(mode) {
            var proj = currentProject();
            if (!proj) { showToast('Pick a project first', true); return; }
            var inpId = mode === 'sprint' ? 'sprint-quick-add' : 'backlog-quick-add';
            var inp = document.getElementById(inpId);
            if (!inp) return;
            var raw = (inp.value || '').trim();
            if (!raw) return;

            // Tokenise by · or | or ,
            var parts = raw.split(/[\u00b7|,]/).map(function (s) { return s.trim(); }).filter(Boolean);
            var title = parts.shift() || raw;
            var priority = 3;
            var estBlocks = 0;
            var featureId = null;

            // Try to match priority + estimate in any remaining parts
            parts.forEach(function (tok) {
                var pm = tok.match(/^p\s*([1-4])$/i);
                if (pm) { priority = parseInt(pm[1], 10); return; }
                var hm = tok.match(/^(\d+(?:\.\d+)?)\s*h$/i);
                if (hm) { estBlocks = Math.round(parseFloat(hm[1]) * 2); return; }
                var mm = tok.match(/^(\d+)\s*m$/i);
                if (mm) { estBlocks = Math.max(1, Math.round(parseInt(mm[1], 10) / 30)); return; }
                // Otherwise treat as feature name (fuzzy match)
                var lower = tok.toLowerCase();
                var fe = features.filter(function (f) { return f.projectId === proj.id; })
                    .find(function (f) { return (f.title || '').toLowerCase().indexOf(lower) > -1; });
                if (fe) featureId = fe.id;
            });

            // Active sprint context if in sprint mode (sprints are global)
            var sprintId = null;
            if (mode === 'sprint') {
                sprintId = activeSprintId || (getActiveSprintAP() && getActiveSprintAP().id) || null;
            }

            var newIssue = {
                id: uid(),
                projectId: proj.id,
                title: title,
                description: '',
                type: 'story',
                status: 'todo',
                priority: priority,
                estBlocks: estBlocks,
                featureId: featureId,
                sprintId: sprintId,
                tasks: [],
                createdAt: Date.now(),
                updatedAt: Date.now()
            };
            issues.unshift(newIssue);
            inp.value = '';
            markUpdated();
            renderAll();
            showToast('Added: ' + title);
        }

        }

                return s.status !== 'active' && s.status !== 'completed' &&
                    (s.status === 'planning' || (s.startDate && s.startDate > today));
            });
            var past = allSprints.filter(function (s) { return s.status === 'completed' });

            html += '<div class="row" style="margin-bottom:10px;justify-content:space-between">';
            html += '<div class="choice-row" style="margin-bottom:0">';
            html += filterPill('active', 'Active (' + active.length + ')', sprintsTabFilter, 'sprintsTabFilter');
            html += filterPill('future', 'Future (' + future.length + ')', sprintsTabFilter, 'sprintsTabFilter');
            html += filterPill('past', 'Past (' + past.length + ')', sprintsTabFilter, 'sprintsTabFilter');
            html += filterPill('all', 'All', sprintsTabFilter, 'sprintsTabFilter');

            html += '<button class="btn primary sm" onclick="openSprintEditor(null,false)">+ New sprint</button>';

                html += '<div class="chart-wrap" style="height:160px"><canvas id="velocity-canvas"></canvas></div>';
                html += '</div>';
            }

            var list = [];
            if (sprintsTabFilter === 'active') list = active;
            else if (sprintsTabFilter === 'future') list = future;
            else if (sprintsTabFilter === 'past') list = past;
            else list = allSprints.slice();

            list.sort(function (a, b) {
                var ad = a.startDate || '', bd = b.startDate || '';
                if (ad === bd) return (b.createdAt || 0) - (a.createdAt || 0);
                return bd.localeCompare(ad);
            });

            if (!list.length) {
                html += '<div class="card"><div class="empty">No sprints in this view.</div></div>';

                list.forEach(function (s) { html += renderSprintListCard(s) });

        function renderSprintListCard(s) {

            var donePts = ss.filter(function (x) { return x.status === 'done' })
                .reduce(function (a, x) { return a + issueEstBlocks(x) }, 0);
            var pct = totalPts ? Math.round(100 * donePts / totalPts) : 0;

                s = {

            var html = '<div class="modal">';
            html += '<h2>' + (isNew ? 'New sprint' : 'Edit sprint') + ' &mdash; #' + s.number + '</h2>';

        function saveSprintFromEditor(isNew, id) {
            var s;
            if (isNew) {
                s = openSprintEditor._draft;
                if (!s) return;
            } else {
                s = sprints.find(function (x) { return x.id === id });
                if (!s) return;
            }
            s.name = document.getElementById('sp-name').value.trim();
            s.goal = document.getElementById('sp-goal').value.trim();
            s.capacityBlocks = Number(document.getElementById('sp-cap').value) || 0;
            s.status = document.getElementById('sp-status').value;
            s.updatedAt = Date.now();
            if (!s.name) { showToast('Name required', true); return; }
            if (isNew) {
                // Dedupe on number — if WT or AP already added this number, just merge into it.
                var existing = sprints.find(function (x) { return x.number === s.number; });
                if (existing) {
                    existing.name = s.name; existing.goal = s.goal;
                    existing.capacityBlocks = s.capacityBlocks;
                    existing.status = s.status; existing.updatedAt = s.updatedAt;
                    s = existing;
                } else {
                    sprints.push(s);
                }
            }
            if (s.status === 'active') activeSprintId = s.id;
            openSprintEditor._draft = null;
            closeModal();
            markUpdated();
            setTab('sprint');
        }

            closeModal();

            var msg = 'Delete this sprint?';
            if (ss.length) msg += '\n\n' + ss.length + ' issue' + (ss.length === 1 ? '' : 's') + ' will return to backlog (across all projects).';
            if (!confirm(msg)) return;
            ss.forEach(function (s) { s.sprintId = null; s.updatedAt = Date.now(); });
            if (activeSprintId === id) activeSprintId = null;
            sprints = sprints.filter(function (s) { return s.id !== id });
            if (plannerDeleted.sprints.indexOf(id) === -1) plannerDeleted.sprints.push(id);
            markUpdated(); renderAll();
            showToast('Sprint deleted');
        }

        function computeAvgVelocity() {
            var done = sprints.filter(function (s) { return s.status === 'completed' });
            if (!done.length) return 0;
            done.sort(function (a, b) { return (b.completedAt || 0) - (a.completedAt || 0) });
            var sample = done.slice(0, 3);
            var sum = 0;
            sample.forEach(function (sp) {
                var ss = issues.filter(function (x) { return x.sprintId === sp.id && x.status === 'done' });
                sum += ss.reduce(function (a, s) { return a + issueEstBlocks(s) }, 0);
            });
            return Math.round(sum / sample.length);
        }

        // ============================================================
        // BURNDOWN / VELOCITY CHARTS
        // ============================================================
        function drawBurndown(sprint, sprintIssues) {
            var canvas = document.getElementById('burndown-canvas');
            if (!canvas || !window.Chart) return;
            if (burndownChart) { burndownChart.destroy(); burndownChart = null }

            var totalPts = sprintIssues.reduce(function (a, s) { return a + issueEstBlocks(s) }, 0);
            var totalDays = Math.max(1, daysBetween(sprint.startDate, sprint.endDate) + 1);
            var labels = [], ideal = [], actual = [];
            var today = todayISO();

            var completedByDate = {};
            sprintIssues.forEach(function (s) {
                if (s.status === 'done' && s.completedAt) {
                    var iso = new Date(s.completedAt).toISOString().slice(0, 10);
                    completedByDate[iso] = (completedByDate[iso] || 0) + issueEstBlocks(s);
                }
            });
            var cumDone = 0;
            for (var i = 0; i < totalDays; i++) {
                var d = addDays(sprint.startDate, i);
                labels.push(fmtDate(d));
                ideal.push(+(totalPts * (1 - i / Math.max(1, totalDays - 1))).toFixed(2));
                if (d <= today) { cumDone += completedByDate[d] || 0; actual.push(totalPts - cumDone); }
                else actual.push(null);
            }

            var css = getComputedStyle(document.documentElement);
            var accent = css.getPropertyValue('--ui-accent').trim() || '#D89A3F';
            var dim = css.getPropertyValue('--ui-text-dim').trim() || '#6E6555';
            var soft = css.getPropertyValue('--ui-text-soft').trim() || '#A89C88';

            burndownChart = new Chart(canvas.getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Ideal', data: ideal, borderColor: dim, borderDash: [4, 4], borderWidth: 1.5, pointRadius: 0, tension: 0, fill: false },
                        { label: 'Actual', data: actual, borderColor: accent, borderWidth: 2.5, backgroundColor: 'rgba(216,154,63,0.15)', pointRadius: 3, pointBackgroundColor: accent, tension: 0, fill: true, spanGaps: false }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: soft, font: { size: 11 } } },
                        tooltip: { backgroundColor: '#1A1714', borderColor: '#443D34', borderWidth: 1 }
                    },
                    scales: {
                        x: { ticks: { color: dim, font: { size: 10 } }, grid: { color: 'rgba(68,61,52,0.4)' } },
                        y: { ticks: { color: dim, font: { size: 10 } }, grid: { color: 'rgba(68,61,52,0.4)' }, beginAtZero: true }
                    }
                }
            });
        }

        function drawVelocity(pastSprints) {
            var canvas = document.getElementById('velocity-canvas');
            if (!canvas || !window.Chart) return;
            if (velocityChart) { velocityChart.destroy(); velocityChart = null }

            var sorted = pastSprints.slice().sort(function (a, b) { return (a.completedAt || 0) - (b.completedAt || 0) }).slice(-8);
            var labels = sorted.map(function (s) { return s.name || '?'; });
            var planned = [], done = [];
            sorted.forEach(function (sp) {
                var ss = issues.filter(function (x) { return x.sprintId === sp.id });
                planned.push(ss.reduce(function (a, x) { return a + issueEstBlocks(x) }, 0));
                done.push(ss.filter(function (x) { return x.status === 'done' })
                    .reduce(function (a, x) { return a + issueEstBlocks(x) }, 0));
            });

            var css = getComputedStyle(document.documentElement);
            var accent = css.getPropertyValue('--ui-accent').trim() || '#D89A3F';
            var dim = css.getPropertyValue('--ui-text-dim').trim() || '#6E6555';
            var soft = css.getPropertyValue('--ui-text-soft').trim() || '#A89C88';

            velocityChart = new Chart(canvas.getContext('2d'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Planned', data: planned, backgroundColor: 'rgba(111,163,199,0.5)' },
                        { label: 'Completed', data: done, backgroundColor: accent }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: soft, font: { size: 11 } } },
                        tooltip: { backgroundColor: '#1A1714', borderColor: '#443D34', borderWidth: 1 }
                    },
                    scales: {
                        x: { ticks: { color: dim, font: { size: 10 } }, grid: { display: false } },
                        y: { ticks: { color: dim, font: { size: 10 } }, grid: { color: 'rgba(68,61,52,0.4)' }, beginAtZero: true }
                    }
                }
            });
        }

        // ============================================================
        // TIME AGGREGATION
        // ============================================================
        function issueActualBlocks(it) {
            // Only count if the issue has specific tracking link overrides set.
            // If it doesn't, we should not fall back to the project's tracking link,
            // as that would double count the project's total time on every single issue.
            var cat = it.trackCat || '';
            var sub = it.trackSub || '';
            if (!cat && !sub) return 0;
            var sprint = it.sprintId ? sprints.find(function (s) { return s.id === it.sprintId }) : null;
            var total = 0;
            (wt.sessions || []).forEach(function (s) {
                if (cat && s.cat !== cat) return;
                if (sub && s.sub !== sub) return;
                if (sprint && sprint.startDate && s.date < sprint.startDate) return;
                if (sprint && sprint.endDate && s.date > sprint.endDate) return;
                total += (s.blocks !== undefined ? s.blocks : 1);
            });
            return total;
        }
        function projectActualBlocks(p) {
            if (!p || !p.trackSub) return 0;
            var total = 0;
            (wt.sessions || []).forEach(function (s) {
                if (p.trackCat && s.cat !== p.trackCat) return;
                if (p.trackSub && s.sub !== p.trackSub) return;
                total += (s.blocks !== undefined ? s.blocks : 1);
            });
            return total;
        }
        function featureActualBlocks(f) {
            if (!f) return 0;
            var cat = f.trackCat || '';
            var sub = f.trackSub || '';
            if (!cat && !sub) return 0;
            var total = 0;
            (wt.sessions || []).forEach(function (s) {
                if (cat && s.cat !== cat) return;
                if (sub && s.sub !== sub) return;
                total += (s.blocks !== undefined ? s.blocks : 1);
            });
            return total;
        }

        // ============================================================
        // SETTINGS TAB
        // ============================================================
        function renderSettingsTab() {
            var el = document.getElementById('tab-settings');
            var html = '';

            html += '<div class="card">';
            html += '<div class="section-head">Projects <span class="count">' + projects.length + '</span></div>';
            if (!projects.length) {
                html += '<div class="empty">No projects yet.</div>';
            } else {
                projects.forEach(function (p) {
                    var its = issues.filter(function (s) { return s.projectId === p.id });
                    var fts = features.filter(function (f) { return f.projectId === p.id });
                    var spr = sprints.filter(function (s) { return s.projectId === p.id });
                    var hrs = projectActualBlocks(p);
                    html += '<div class="project-card" style="--proj-color:' + (p.color || '#D89A3F') + '">';
                    html += '<div class="row" style="justify-content:space-between;align-items:flex-start">';
                    html += '<div style="flex:1;min-width:0">';
                    html += '<div class="name">' + escHtml(p.name) + (p.status === 'archived' ? ' <span class="pill">archived</span>' : '') + '</div>';
                    if (p.description) html += '<div class="desc">' + escHtml(p.description) + '</div>';
                    html += '<div class="row" style="font-size:11px;color:var(--ui-text-soft)">';
                    html += '<span class="pill">link: ' + escHtml(p.trackCat || '-') + ' / ' + escHtml(p.trackSub || '-') + '</span>';
                    html += '<span class="pill">' + fts.length + ' features</span>';
                    html += '<span class="pill">' + its.length + ' issues</span>';
                    html += '<span class="pill">' + spr.length + ' sprints</span>';
                    html += '<span class="pill time">' + fmtHours(hrs) + ' logged</span>';
                    html += '</div></div>';
                    html += '<div class="row-tight" style="margin-left:8px">';
                    html += '<button class="btn ghost icon" onclick="openProjectEditor(\'' + p.id + '\')" title="Edit">&#9998;</button>';
                    html += '</div></div></div>';
                });
            }
            html += '<div class="row" style="margin-top:10px"><button class="btn primary" onclick="openProjectEditor(null)">+ New project</button></div>';
            html += '</div>';

            html += '<div class="card">';
            html += '<div class="section-head">Sync</div>';
            html += '<div class="field"><label>Firebase Realtime DB URL</label>';
            html += '<input id="set-dburl" type="text" placeholder="https://your-app.firebaseio.com" value="' + escHtml(FIREBASE_DB_URL) + '">';
            html += '<div class="help-text">Same RTDB as your Work Tracker. The planner reads &amp; writes the same JSON document under your sync ID; worktracker data is preserved.</div></div>';
            html += '<div class="field"><label>Sync ID</label>';
            html += '<input id="set-syncid" type="text" placeholder="personal-main" value="' + escHtml(FIREBASE_SYNC_ID) + '">';
            html += '<div class="help-text">Anyone with this ID can read/write your data. Use the same ID as worktracker.</div></div>';
            var trackerStored = '';
            try { trackerStored = localStorage.getItem('plnr_tracker_url') || ''; } catch (e) {}
            html += '<div class="field"><label>Worktracker URL (for back link)</label>';
            html += '<input id="set-trackerurl" type="text" placeholder="https://your-tracker-url/" value="' + escHtml(trackerStored) + '">';
            html += '<div class="help-text">Used by the &#x2197; Tracker link in the header.</div></div>';
            html += '<div class="row" style="margin-top:8px">';
            html += '<button class="btn primary" onclick="applySyncSettings()">Save &amp; sync now</button>';
            html += '<button class="btn" onclick="syncNow(false)">Sync now</button>';
            html += '</div>';
            html += '</div>';

            html += '<div class="card">';
            html += '<div class="section-head">Local data</div>';
            html += '<div style="font-size:13px;color:var(--ui-text-soft);line-height:1.7">';
            html += '&bull; <b>' + projects.length + '</b> projects<br>';
            html += '&bull; <b>' + features.length + '</b> features<br>';
            html += '&bull; <b>' + issues.length + '</b> issues (' + issues.filter(function (s) { return !s.sprintId }).length + ' in backlog)<br>';
            html += '&bull; <b>' + sprints.length + '</b> sprints (' + sprints.filter(function (s) { return s.status === 'active' }).length + ' active)<br>';
            html += '&bull; Linked worktracker: <b>' + wt.sessions.length + '</b> sessions, <b>' + wt.tasks.length + '</b> tasks<br>';
            if (plannerUpdatedAt) html += '&bull; Last update: ' + new Date(plannerUpdatedAt).toLocaleString() + '<br>';
            html += '</div></div>';

            html += '<div class="card">';
            html += '<div class="section-head">Data</div>';
            html += '<div class="row">';
            html += '<button class="btn" onclick="exportData()">Export JSON</button>';
            html += '<button class="btn" onclick="document.getElementById(\'import-file\').click()">Import JSON</button>';
            html += '<input type="file" id="import-file" accept="application/json" style="display:none" onchange="importData(this)">';
            html += '<button class="btn danger" onclick="wipeLocal()">Wipe local cache</button>';
            html += '</div>';
            html += '<div class="help-text">Wipe clears only the device cache &mdash; remote data on Firebase is preserved and will resync.</div>';
            html += '</div>';

            el.innerHTML = html;
        }

        function applySyncSettings() {
            FIREBASE_DB_URL = document.getElementById('set-dburl').value.trim();
            FIREBASE_SYNC_ID = document.getElementById('set-syncid').value.trim();
            var t = document.getElementById('set-trackerurl');
            if (t) {
                try { localStorage.setItem('plnr_tracker_url', t.value.trim()); } catch (e) {}
                var link = document.getElementById('link-tracker');
                if (link && t.value.trim()) link.href = t.value.trim();
            }
            saveSettings();
            syncNow(false);
        }

        function exportData() {
            var data = {
                projects: projects, features: features, issues: issues, sprints: sprints,
                currentProjectId: currentProjectId,
                activeSprintId: activeSprintId,
                plannerUpdatedAt: plannerUpdatedAt
            };
            var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url; a.download = 'planner-' + todayISO() + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(input) {
            var f = input.files && input.files[0]; if (!f) return;
            var rd = new FileReader();
            rd.onload = function () {
                try {
                    var d = JSON.parse(rd.result);
                    if (!confirm('Replace local data with imported file? Remote will overwrite on next sync.')) return;
                    if (Array.isArray(d.projects)) projects = d.projects;
                    if (Array.isArray(d.features)) features = d.features;
                    if (Array.isArray(d.issues)) issues = d.issues;
                    if (Array.isArray(d.sprints)) sprints = d.sprints;
                    if (d.currentProjectId !== undefined) currentProjectId = d.currentProjectId;
                    if (d.activeSprintId !== undefined) activeSprintId = d.activeSprintId;
                    else if (d.activeSprintByProject) {
                        var keys = Object.keys(d.activeSprintByProject);
                        if (keys.length) activeSprintId = d.activeSprintByProject[keys[0]];
                    }
                    migrateLegacySprints();
                    markUpdated(); renderProjectPicker(); renderAll();
                    showToast('Imported');
                } catch (e) { showToast('Invalid JSON', true); }
            };
            rd.readAsText(f);
            input.value = '';
        }

        function wipeLocal() {
            if (!confirm('Wipe local cache? Remote data is preserved.')) return;
            try { localStorage.removeItem(LOCAL_KEY); } catch (e) {}
            projects = []; features = []; issues = []; sprints = [];
            currentProjectId = null; activeSprintId = null; plannerUpdatedAt = 0;
            plannerDeleted = { projects: [], features: [], issues: [], sprints: [] };
            wt = { sessions: [], tasks: [], sublists: {}, categoryOrder: [], categoryMeta: {}, deletedIds: [], updatedAt: 0 };
            renderProjectPicker(); renderAll();
            syncNow(false);
        }

        // ============================================================
        // MODAL
        // ============================================================
        function showModal(html) {
            var m = document.getElementById('modal');
            m.innerHTML = html;
            m.classList.add('show');
            m.onclick = function (e) { if (e.target === m) closeModal() };
            setTimeout(function () {
                var first = m.querySelector('input,textarea,select');
                if (first) first.focus();
            }, 30);
        }
        function closeModal() {
            var m = document.getElementById('modal');
            m.classList.remove('show');
            m.innerHTML = '';
        }

        // ============================================================
        // BOOT
        // ============================================================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>

</html>

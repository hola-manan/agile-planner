<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#100E0B">
    <title>Agile Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --ui-bg: #100E0B;
            --ui-bg-soft: #1A1714;
            --ui-card: #211D18;
            --ui-card-2: #2A251E;
            --ui-border: #2E2924;
            --ui-border-strong: #443D34;
            --ui-text: #EDE7DC;
            --ui-text-soft: #A89C88;
            --ui-text-dim: #6E6555;
            --ui-accent: #D89A3F;
            --ui-accent-2: #B97F2A;
            --ui-success: #7BB880;
            --ui-warning: #E0B255;
            --ui-danger: #D26A5C;
            --ui-info: #6FA3C7;
            --font-sans: 'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif;
            --border-radius-lg: 14px;
            --border-radius-md: 10px;
            --border-radius-sm: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0 }

        html, body {
            background: var(--ui-bg);
            color: var(--ui-text);
            font-family: var(--font-sans);
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); border: 0
        }

        .app {
            padding: 0.4rem 0.4rem 4rem;
            max-width: none;
            width: 100%;
            margin: 0;
            background: var(--ui-bg);
            color: var(--ui-text);
            min-height: 100vh;
            min-height: 100dvh;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            gap: 8px; margin-bottom: 8px; padding: 6px 4px;
            flex-wrap: wrap;
        }
        .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto }
        .header h1 {
            font-family: 'Instrument Serif', 'Iowan Old Style', 'Palatino', Georgia, serif;
            font-size: 20px; font-weight: 400; letter-spacing: -0.015em; line-height: 1.1;
            color: var(--ui-text);
            flex-shrink: 0;
            white-space: nowrap;
        }
        .header .right {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        .sync-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--ui-text-dim);
            transition: background 0.3s;
        }
        .sync-dot.ok { background: var(--ui-success); box-shadow: 0 0 8px rgba(123,184,128,0.5); }
        .sync-dot.busy { background: var(--ui-warning); animation: pulse 1s infinite; }
        .sync-dot.err { background: var(--ui-danger); }
        @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
        .header-link {
            font-size: 11px; color: var(--ui-accent); text-decoration: none;
            border: 1px solid var(--ui-accent); padding: 5px 11px; border-radius: 999px;
            font-weight: 500; white-space: nowrap; letter-spacing: 0.02em;
        }

        .project-picker {
            background: var(--ui-bg-soft);
            border: 0.5px solid var(--ui-border-strong);
            color: var(--ui-text);
            font-family: var(--font-sans); font-size: 14px; font-weight: 600;
            padding: 6px 10px;
            border-radius: var(--border-radius-md);
            cursor: pointer; min-width: 0; max-width: 180px; width: auto;
            text-overflow: ellipsis;
            outline: none;
            flex-shrink: 1;
        }

        .tabs {
            display: flex; gap: 4px; margin-bottom: 14px; padding: 0;
            background: transparent;
            border: 0; border-bottom: 1px solid var(--ui-border);
            border-radius: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none }
        .tab {
            flex: 0 0 auto; white-space: nowrap; padding: 10px 14px 11px;
            background: transparent; border: 0;
            border-radius: 0;
            font-size: 14px; font-weight: 500; cursor: pointer;
            color: var(--ui-text-soft); font-family: var(--font-sans);
            letter-spacing: -0.005em;
            transition: color .15s ease, box-shadow .15s ease;
            margin-bottom: -1px;
        }
        .tab:hover { color: var(--ui-text) }
        .tab.active {
            background: transparent;
            color: var(--ui-text);
            border-color: transparent;
            box-shadow: inset 0 -2px 0 var(--ui-accent);
            border-radius: 0;
        }

        .card {
            background: var(--ui-card);
            border: 0.5px solid var(--ui-border);
            border-radius: var(--border-radius-lg);
            padding: 14px;
            margin-bottom: 12px;
        }

        .section-head {
            font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--ui-text-soft);
            margin-bottom: 10px;
        }
        .section-head .count {
            background: var(--ui-bg-soft); border: 0.5px solid var(--ui-border);
            padding: 1px 7px; border-radius: 8px; font-size: 11px;
            color: var(--ui-text-dim); margin-left: 6px;
            font-weight: 600;
        }

        .empty {
            text-align: center; padding: 24px 12px; color: var(--ui-text-dim);
            font-size: 13px; font-style: italic;
        }

        .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
        .row-tight { display: flex; gap: 6px; align-items: center }
        .grow { flex: 1 1 auto; min-width: 0 }

        input[type=text], input[type=number], input[type=date], select, textarea {
            background: var(--ui-bg-soft);
            border: 0.5px solid var(--ui-border);
            color: var(--ui-text);
            font-family: var(--font-sans); font-size: 15px;
            padding: 9px 11px;
            border-radius: var(--border-radius-md);
            width: 100%;
            outline: none;
            transition: border-color .15s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--ui-accent) }
        textarea { resize: vertical; min-height: 60px; font-family: var(--font-sans) }
        label {
            display: block; font-size: 11px; font-weight: 600;
            color: var(--ui-text-soft); margin-bottom: 4px;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .field { margin-bottom: 10px }

        .btn {
            background: var(--ui-bg-soft);
            border: 0.5px solid var(--ui-border);
            color: var(--ui-text);
            font-family: var(--font-sans); font-size: 14px; font-weight: 600;
            padding: 9px 14px;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap;
        }
        .btn:hover { border-color: var(--ui-border-strong) }
        .btn.primary {
            background: var(--ui-accent);
            border-color: transparent; color: white;
        }
        .btn.primary:hover { filter: brightness(1.1) }
        .btn.danger { color: var(--ui-danger); border-color: rgba(210,106,92,0.4) }
        .btn.danger:hover { background: rgba(210,106,92,0.1) }
        .btn.ghost { background: transparent; border-color: transparent; color: var(--ui-text-soft); padding: 6px 8px }
        .btn.ghost:hover { color: var(--ui-text); background: var(--ui-bg-soft) }
        .btn.sm { padding: 5px 10px; font-size: 12px }
        .btn.icon { padding: 6px 9px; font-size: 15px; line-height: 1 }

        .pill {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 600;
            padding: 3px 8px; border-radius: 10px;
            background: var(--ui-bg-soft);
            border: 0.5px solid var(--ui-border);
            color: var(--ui-text-soft);
        }
        .pill.points { color: var(--ui-accent-2); border-color: rgba(216,154,63,0.4) }
        .pill.feature { color: var(--ui-info); border-color: rgba(111,163,199,0.4) }
        .pill.prio-1 { color: var(--ui-danger); border-color: rgba(210,106,92,0.4) }
        .pill.prio-2 { color: var(--ui-warning); border-color: rgba(224,178,85,0.4) }
        .pill.prio-3 { color: var(--ui-text-soft) }
        .pill.prio-4 { color: var(--ui-text-dim) }
        .pill.status-todo { color: var(--ui-text-dim) }
        .pill.status-in-progress { color: var(--ui-warning); border-color: rgba(224,178,85,0.4) }
        .pill.status-review { color: var(--ui-info); border-color: rgba(111,163,199,0.4) }
        .pill.status-done { color: var(--ui-success); border-color: rgba(123,184,128,0.4) }
        .pill.sprint-active { color: var(--ui-success); border-color: rgba(123,184,128,0.4) }
        .pill.sprint-planning { color: var(--ui-warning); border-color: rgba(224,178,85,0.4) }
        .pill.sprint-completed { color: var(--ui-text-dim) }
        .pill.time { color: var(--ui-text-soft) }
        .pill.type-bug { color: var(--ui-danger); border-color: rgba(210,106,92,0.4) }
        .pill.type-chore { color: var(--ui-text-dim) }
        .pill.type-story { color: var(--ui-info); border-color: rgba(111,163,199,0.4) }

        .choice-row {
            display: flex; gap: 5px; flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .choice-btn {
            font-family: var(--font-sans); font-size: 12px; font-weight: 600;
            padding: 6px 11px;
            background: var(--ui-bg-soft); border: 0.5px solid var(--ui-border);
            color: var(--ui-text-soft);
            border-radius: var(--border-radius-md); cursor: pointer;
            transition: all .15s;
        }
        .choice-btn:hover { color: var(--ui-text) }
        .choice-btn.active {
            background: linear-gradient(135deg, rgba(216,154,63,0.25), rgba(216,154,63,0.12));
            color: var(--ui-text);
            border-color: var(--ui-border-strong);
        }

        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: var(--ui-accent);
            color: white;
            font-size: 32px;
            font-weight: 300;
            border: none;
            box-shadow: 0 6px 16px rgba(216,154,63,0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        /* Issue card */
        .issue-card {
            background: var(--ui-card);
            border: 0.5px solid var(--ui-border);
            border-radius: var(--border-radius-md);
            margin-bottom: 8px;
            overflow: hidden;
            transition: border-color .15s;
        }
        .issue-card:hover { border-color: var(--ui-border-strong) }
        .issue-card.status-done { opacity: 0.7 }
        .issue-card.status-done .issue-title { text-decoration: line-through; color: var(--ui-text-dim) }
        .issue-card .head {
            padding: 11px 12px;
            cursor: pointer;
            display: flex; gap: 10px; align-items: flex-start;
        }
        .issue-card .head:hover { background: var(--ui-card-2) }
        .issue-card .head .body { flex: 1; min-width: 0 }
        .issue-card .head .toggle {
            color: var(--ui-text-dim); font-size: 14px;
            transition: transform .15s;
        }
        .issue-card.expanded .head .toggle { transform: rotate(90deg) }
        .issue-title {
            font-size: 14px; font-weight: 600;
            color: var(--ui-text); line-height: 1.35;
            margin-bottom: 4px; word-break: break-word;
        }
        .issue-meta {
            display: flex; gap: 5px; flex-wrap: wrap; align-items: center;
            font-size: 11px; color: var(--ui-text-soft);
        }
        .issue-body {
            display: none; padding: 4px 12px 14px;
            border-top: 0.5px solid var(--ui-border);
        }
        .issue-card.expanded .issue-body { display: block }
        .issue-body .field-label {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--ui-text-dim);
            margin-top: 12px; margin-bottom: 4px;
        }
        .issue-body .desc-text {
            font-size: 14px; color: var(--ui-text-soft);
            line-height: 1.5; white-space: pre-wrap; word-break: break-word;
        }

        .task-row {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 0;
            border-bottom: 0.5px solid var(--ui-border);
        }
        .task-row:last-child { border-bottom: none }
        .task-check {
            width: 18px; height: 18px;
            border: 1.5px solid var(--ui-border-strong);
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            color: transparent;
            font-size: 12px; font-weight: 700;
            flex-shrink: 0;
            transition: all .15s;
        }
        .task-row.done .task-check {
            background: var(--ui-accent);
            border-color: var(--ui-accent);
            color: white;
        }
        .task-input {
            flex: 1; font-size: 13px;
            color: var(--ui-text);
            background: transparent; border: none; outline: none;
            font-family: var(--font-sans);
            min-width: 0;
        }
        .task-row.done .task-input { text-decoration: line-through; color: var(--ui-text-dim) }

        .progress-bar {
            height: 4px; background: var(--ui-bg-soft); border-radius: 2px;
            overflow: hidden; margin-top: 4px;
        }
        .progress-bar > div {
            height: 100%; background: var(--ui-accent);
            transition: width .3s;
        }

        /* Sprint hero */
        .sprint-hero {
            background: linear-gradient(135deg, rgba(216,154,63,0.12), rgba(216,154,63,0.05));
            border: 0.5px solid var(--ui-border-strong);
        }
        .sprint-hero .name {
            font-size: 18px; font-weight: 700; color: var(--ui-text);
            margin-bottom: 4px;
        }
        .sprint-hero .goal {
            font-size: 13px; color: var(--ui-text-soft);
            font-style: italic; margin-bottom: 10px;
        }
        .sprint-hero .stats {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            margin-bottom: 10px;
        }
        .stat-tile {
            background: var(--ui-bg-soft);
            border: 0.5px solid var(--ui-border);
            border-radius: var(--border-radius-md);
            padding: 8px 10px; text-align: center;
        }
        .stat-tile .v {
            font-size: 18px; font-weight: 700; color: var(--ui-text);
            line-height: 1.1;
        }
        .stat-tile .l {
            font-size: 10px; font-weight: 600; color: var(--ui-text-dim);
            text-transform: uppercase; letter-spacing: 0.06em;
            margin-top: 2px;
        }

        .status-group { margin-bottom: 14px }
        .status-group-head {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 6px; padding: 0 2px;
        }
        .status-group-head .label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--ui-text-soft);
        }
        .status-group-head .pts {
            font-size: 11px; color: var(--ui-text-dim);
        }

        /* Feature card */
        .feature-card {
            background: var(--ui-card);
            border: 0.5px solid var(--ui-border);
            border-radius: var(--border-radius-md);
            padding: 12px; margin-bottom: 8px;
            position: relative;
            overflow: hidden;
        }
        .feature-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px; background: var(--feature-color, var(--ui-accent));
        }
        .feature-card .name {
            font-size: 14px; font-weight: 700; color: var(--ui-text);
            margin-bottom: 4px;
        }
        .feature-card .desc {
            font-size: 12px; color: var(--ui-text-soft); margin-bottom: 8px;
            line-height: 1.4;
        }

        /* Sprint list card */
        .sprint-list-card {
            background: var(--ui-card);
            border: 0.5px solid var(--ui-border);
            border-radius: var(--border-radius-md);
            padding: 11px 12px; margin-bottom: 8px;
            cursor: pointer;
            transition: border-color .15s;
        }
        .sprint-list-card:hover { border-color: var(--ui-border-strong) }
        .sprint-list-card.active {
            border-color: var(--ui-accent);
            box-shadow: 0 0 0 1px rgba(216,154,63,0.3) inset;
        }
        .sprint-list-card .row1 {
            display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
        }
        .sprint-list-card .name {
            font-size: 14px; font-weight: 700; color: var(--ui-text);
            flex: 1; min-width: 0; word-break: break-word;
        }
        .sprint-list-card .row2 {
            font-size: 11px; color: var(--ui-text-soft);
            display: flex; gap: 10px; flex-wrap: wrap;
        }

        /* Project card (in Settings) */
        .project-card {
            background: var(--ui-card);
            border: 0.5px solid var(--ui-border);
            border-radius: var(--border-radius-md);
            padding: 12px; margin-bottom: 8px;
            position: relative; overflow: hidden;
        }
        .project-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 4px; background: var(--proj-color, var(--ui-accent));
        }
        .project-card .name {
            font-size: 15px; font-weight: 700; color: var(--ui-text);
            margin-bottom: 4px;
        }
        .project-card .desc {
            font-size: 12px; color: var(--ui-text-soft); line-height: 1.4;
            margin-bottom: 6px;
        }

        /* Modal */
        .modal-bg {
            position: fixed; inset: 0;
            background: rgba(9,6,18,0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            align-items: flex-start; justify-content: center;
            padding: 16px;
            overflow-y: auto;
        }
        .modal-bg.show { display: flex }
        .modal {
            background: var(--ui-card);
            border: 0.5px solid var(--ui-border-strong);
            border-radius: var(--border-radius-lg);
            padding: 18px;
            max-width: 520px; width: 100%;
            margin: auto;
        }
        .modal h2 {
            font-size: 16px; font-weight: 700; margin-bottom: 14px;
            color: var(--ui-text);
        }
        .modal .modal-actions {
            display: flex; gap: 8px; justify-content: flex-end;
            margin-top: 16px; flex-wrap: wrap;
        }

        /* Quick-add bar */
        .quick-add {
            display: flex; gap: 6px; margin-bottom: 12px;
            background: var(--ui-bg-soft);
            border: 0.5px solid var(--ui-border);
            border-radius: var(--border-radius-md);
            padding: 6px;
        }
        .quick-add input {
            flex: 1; border: none; background: transparent;
            padding: 7px 8px;
        }
        .quick-add input:focus { border: none }

        /* Toast */
        .toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--ui-card);
            border: 0.5px solid var(--ui-border-strong);
            color: var(--ui-text);
            padding: 10px 16px;
            border-radius: var(--border-radius-md);
            font-size: 13px; font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            transition: transform .25s ease, opacity .25s;
            opacity: 0; pointer-events: none;
            z-index: 200; max-width: 90vw;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1 }

        canvas { max-width: 100%; height: auto !important }
        .chart-wrap { position: relative; height: 180px; margin-top: 6px }

        .swatch-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px }
        .swatch {
            width: 26px; height: 26px; border-radius: 6px;
            cursor: pointer; border: 2px solid transparent;
        }
        .swatch.active { border-color: var(--ui-text) }

        .help-text {
            font-size: 11px; color: var(--ui-text-dim);
            margin-top: 3px; line-height: 1.4;
        }

        .divider { height: 0.5px; background: var(--ui-border); margin: 14px 0 }

        /* Mobile-first responsive overrides */
        @media (max-width: 520px) {
            .header { flex-direction: column; align-items: stretch; gap: 10px; }
            .header-left { width: 100%; min-width: 0; gap: 10px; }
            .header-left h1 { font-size: 22px; }
            .project-picker { max-width: none !important; flex: 1 1 auto; }
            .header .right { justify-content: space-between; }
        }

        /* Slim & soften the FAB so it never overpowers content */
        .fab {
            width: 48px !important; height: 48px !important; border-radius: 24px !important;
            font-size: 26px !important; font-weight: 400 !important;
            bottom: max(16px, env(safe-area-inset-bottom, 16px)) !important;
            right: 16px !important;
            box-shadow: 0 4px 14px rgba(216,154,63, 0.22) !important;
        }
        .fab:hover { box-shadow: 0 6px 18px rgba(216,154,63, 0.32) !important; }

        /* Tighten card chip wrapping on narrow widths */
        @media (max-width: 520px) {
            .issue-meta { font-size: 10px; gap: 4px; }
            .pill { font-size: 10px; padding: 2px 7px; }
            .sprint-hero .stats { grid-template-columns: repeat(3, 1fr) !important; }
            .stat-tile .v { font-size: 16px; }
            .stat-tile { padding: 6px 8px; }
            .app { padding-bottom: 88px; }
        }

        @media (min-width: 640px) {
            .app { padding: 1.25rem 0.9rem 1.6rem; max-width: 760px; margin: 0 auto; border-radius: 14px; min-height: auto; }
            .sprint-hero .stats { grid-template-columns: repeat(5, 1fr) }
        }

        .block-picker { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border: 0.5px solid var(--ui-border); border-radius: var(--border-radius-md); background: var(--ui-bg-soft); }
        .block-picker button { width: 32px; height: 32px; border: 0.5px solid var(--ui-border-strong); border-radius: 6px; background: var(--ui-bg); font-size: 16px; cursor: pointer; color: var(--ui-text); display: flex; align-items: center; justify-content: center; }
        .block-picker button:hover { background: var(--ui-accent); color: #fff; border-color: var(--ui-accent); }
        .block-picker button:active { transform: scale(0.95); }
        .block-val { font-size: 16px; font-weight: 700; color: var(--ui-text); min-width: 24px; text-align: center; }

        .task-item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-bottom: 0.5px solid var(--ui-border); }
        .task-item:last-child { border-bottom: none; }
        .task-check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--ui-border-strong); background: var(--ui-bg-soft); cursor: pointer; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: transparent; transition: all .15s ease; touch-action: manipulation; }
        .task-check.done { background: var(--ui-accent); border-color: transparent; color: #fff; }
        .task-info { flex: 1; min-width: 0; }
        .task-title { font-size: 15px; font-weight: 500; color: var(--ui-text); word-break: break-word; }
        .task-title.done { text-decoration: line-through; opacity: 0.5; }
        .task-map { font-size: 12px; color: var(--ui-text-soft); margin-top: 3px; }
        .s-notes { margin-top:4px; font-style:italic; word-break:break-word; color: var(--ui-text-soft); font-size:12px; }
        .task-actions { display: flex; gap: 4px; opacity: 0.5; transition: opacity 0.2s; }
        .task-item:hover .task-actions { opacity: 1; }
        .task-actions button { background: none; border: none; font-size: 14px; cursor: pointer; color: var(--ui-text); padding: 4px; }
        .task-actions button:hover { color: var(--ui-accent); }
    

        /* =====================================================
         * STRUCTURAL REDESIGN — applied on top of base styles
         * ===================================================== */

        /* Real type hierarchy for section heads — drop uppercase tracking */
        .section-head {
            font-family: 'Instrument Serif', 'Iowan Old Style', 'Palatino', Georgia, serif;
            font-size: 17px;
            font-weight: 400;
            text-transform: none;
            letter-spacing: -0.01em;
            color: var(--ui-text);
            margin-bottom: 12px;
            white-space: nowrap;
        }
        .section-head .count {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            color: var(--ui-text-dim);
            background: transparent;
            border: 0;
            padding: 0;
            letter-spacing: 0;
        }
        .section-head .count::before { content: "/ "; color: var(--ui-text-dim); }

        /* Status group head — used inside the sprint board */
        .status-group-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ui-text-soft);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--ui-border);
        }
        .status-group-head .label { font-weight: 500; }
        .status-group-head .pts { color: var(--ui-text-dim); }

        /* === Chip cleanup === */
        /* Most pills become plain mono captions separated by · */
        .issue-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            color: var(--ui-text-soft);
            letter-spacing: 0.01em;
            line-height: 1.5;
        }
        .issue-meta .pill {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            font-weight: 400;
            background: transparent !important;
            border: 0 !important;
            padding: 0 !important;
            border-radius: 0;
            color: var(--ui-text-soft);
            letter-spacing: 0.01em;
            display: inline-flex;
            align-items: center;
            gap: 0;
        }
        .issue-meta .pill + .pill::before {
            content: "·";
            margin: 0 7px;
            color: var(--ui-text-dim);
            opacity: 0.8;
        }
        /* Priority + feature get a tiny color cue */
        .issue-meta .pill.prio-1 { color: var(--ui-danger); font-weight: 500; }
        .issue-meta .pill.prio-2 { color: var(--ui-warning); font-weight: 500; }
        .issue-meta .pill.prio-3,
        .issue-meta .pill.prio-4 { color: var(--ui-text-dim); }
        .issue-meta .pill.feature {
            color: var(--ui-text-soft);
        }
        .issue-meta .pill.feature::before {
            /* Color the leading separator with feature hue (set via inline color) */
        }
        /* Feature pill — show a small colored dot before the name */
        .issue-meta .pill.feature {
            position: relative;
            padding-left: 12px !important;
        }
        .issue-meta .pill.feature::after {
            content: "";
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%);
            width: 6px; height: 6px;
            background: currentColor;
            border-radius: 2px;
            opacity: 0.85;
        }
        /* Override the ::before separator for the feature pill so the dot sits inside the gap */
        .issue-meta .pill.feature + .pill::before { content: "·"; }
        .issue-meta .pill.points,
        .issue-meta .pill.time { color: var(--ui-text-soft); }
        .issue-meta .pill.status-in-progress,
        .issue-meta .pill.status-review,
        .issue-meta .pill.status-done { color: var(--ui-text-dim); }
        .issue-meta .pill.type-bug { color: var(--ui-danger); }

        /* Issue title — slightly stronger weight to anchor the row */
        .issue-title {
            font-size: 14.5px !important;
            font-weight: 500 !important;
            letter-spacing: -0.005em;
            line-height: 1.3 !important;
            margin-bottom: 5px !important;
        }

        /* Sprint hero — drop the gradient look, treat as a normal card with side accent */
        .sprint-hero {
            background: var(--ui-card) !important;
            border-left: 2px solid var(--ui-accent) !important;
        }
        .sprint-hero .name {
            font-family: 'Instrument Serif', 'Iowan Old Style', 'Palatino', Georgia, serif;
            font-size: 22px !important;
            font-weight: 400 !important;
            letter-spacing: -0.015em;
            line-height: 1.1;
            margin-bottom: 6px !important;
        }
        .sprint-hero .goal {
            font-style: italic;
            color: var(--ui-text-soft);
            font-size: 13px;
            margin-bottom: 12px;
        }
        .sprint-hero .stat-tile {
            background: transparent;
            border: 0;
            border-right: 1px solid var(--ui-border);
            border-radius: 0;
            padding: 8px 12px;
            text-align: left;
        }
        .sprint-hero .stat-tile:last-child { border-right: 0; }
        .sprint-hero .stat-tile .v {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 18px !important;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--ui-text);
        }
        .sprint-hero .stat-tile .l {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 9px !important;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ui-text-dim);
            margin-top: 3px;
        }

        /* === SPRINT BOARD: columns on desktop, stack on mobile === */
        .board-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media (min-width: 720px) {
            .board-grid { grid-template-columns: 1fr 1fr 1fr; }
            .board-grid .status-group:nth-child(4) {
                /* Review column merges into "In progress" visually below "To do" if needed.
                   Easier: span column 2 row 2. We have 4 statuses but typically 3 cols.
                   Make Review fold into column 2 (In progress) by spanning. */
                grid-column: 2;
                grid-row: 2;
            }
            .board-grid .status-group:nth-child(3) { grid-column: 2; grid-row: 1; }
            .board-grid .status-group:nth-child(2) { grid-column: 1; grid-row: 1; }
            .board-grid .status-group:nth-child(1) { /* fallback */ }
        }
        .board-grid .status-group {
            background: transparent;
            min-width: 0;
        }
        .board-grid .issue-card {
            margin-bottom: 8px;
        }
        /* On desktop, hide the redundant status-filter pills (columns provide that already) */
        @media (min-width: 720px) {
            #tab-sprint > .choice-row { display: none; }
        }
        /* On mobile, hide the column-merge rules so they don't fight */
        @media (max-width: 719px) {
            .board-grid { grid-template-columns: 1fr !important; }
            .board-grid .status-group { grid-column: auto !important; grid-row: auto !important; }
        }

        /* Empty sprint state — better onboarding */
        .empty-hero {
            background: var(--ui-card);
            border: 1px solid var(--ui-border);
            border-radius: var(--border-radius-lg);
            padding: 28px 22px;
            text-align: left;
        }
        .empty-hero h3 {
            font-family: 'Instrument Serif', 'Iowan Old Style', 'Palatino', Georgia, serif;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: -0.015em;
            line-height: 1.15;
            margin-bottom: 10px;
        }
        .empty-hero h3 em { font-style: italic; color: var(--ui-text-soft); }
        .empty-hero p {
            font-size: 14px;
            color: var(--ui-text-soft);
            line-height: 1.55;
            margin-bottom: 18px;
            max-width: 480px;
        }
        .empty-hero .actions { display: flex; gap: 8px; flex-wrap: wrap; }

        /* === FEATURE CARDS: clean up metric chips === */
        .feature-card .row .pill { 
            background: transparent !important; 
            border: 0 !important; 
            padding: 0 !important;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            color: var(--ui-text-soft);
            letter-spacing: 0.01em;
        }
        .feature-card .row .pill + .pill::before {
            content: "·"; margin: 0 7px; color: var(--ui-text-dim); opacity: 0.7;
        }

        /* Section / status group head INSIDE backlog should match new hierarchy */
        .status-group { margin-bottom: 18px; }

        /* Issue card hover — subtle */
        .issue-card { transition: border-color .15s, background .15s; }
        .issue-card:hover { background: var(--ui-card-2); }

        /* Sync dot caption — tiny mono "saved · just now" companion */
        .sync-caption {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            color: var(--ui-text-dim);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

    
        /* === Filter chip cleanup === */
        .choice-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--ui-border);
        }
        .choice-btn {
            font-family: 'JetBrains Mono', ui-monospace, monospace !important;
            font-size: 11px !important;
            font-weight: 500 !important;
            padding: 4px 9px !important;
            background: transparent !important;
            border: 1px solid var(--ui-border) !important;
            color: var(--ui-text-soft) !important;
            border-radius: 999px !important;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: color .15s, border-color .15s, background .15s !important;
        }
        .choice-btn:hover {
            color: var(--ui-text) !important;
            border-color: var(--ui-border-strong) !important;
        }
        .choice-btn.active {
            background: var(--ui-text) !important;
            color: var(--ui-bg) !important;
            border-color: var(--ui-text) !important;
        }

        /* === Quick-add bar — used on sprint/backlog/features === */
        .quick-add {
            display: flex;
            gap: 6px;
            padding: 6px;
            margin-bottom: 12px;
            background: var(--ui-card);
            border: 1px solid var(--ui-border);
            border-radius: var(--border-radius-md);
            align-items: center;
        }
        .quick-add input {
            background: transparent !important;
            border: 0 !important;
            padding: 6px 10px !important;
            color: var(--ui-text);
            font-family: var(--font-sans);
            font-size: 13.5px !important;
            outline: 0;
            flex: 1;
            min-width: 0;
        }
        .quick-add input::placeholder { color: var(--ui-text-dim); }
        .quick-add .btn.primary {
            padding: 6px 12px !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            background: var(--ui-accent) !important;
            color: #1a1408 !important;
            border-color: var(--ui-accent) !important;
        }
        .quick-add .btn.primary:hover { filter: brightness(1.08); }
        .quick-add .hint {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            color: var(--ui-text-dim);
            letter-spacing: 0.02em;
            padding-right: 6px;
        }
        @media (max-width: 480px) {
            .quick-add .hint { display: none; }
        }

        /* === Sprint hero crumb (above name) === */
        .sprint-crumb {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ui-text-dim);
            margin-bottom: 8px;
        }
        .sprint-crumb .sep { margin: 0 7px; opacity: 0.5; }
        .sprint-crumb .day { color: var(--ui-accent); }

    </style>
</head>

<body>
    <div class="app" id="app">
        <div class="header">
            <div class="header-left">
                <h1>Agile Planner</h1>
                <select class="project-picker" id="project-picker" onchange="onProjectPickerChange(this.value)"></select>
            </div>
            <div class="right">
                <div id="sync-dot" class="sync-dot" title="Sync status"></div>
                <a href="#" id="link-tracker" class="header-link">&#x2197; Tracker</a>
            </div>
        </div>

        <div class="tabs" role="tablist">
            <button class="tab active" data-tab="sprint" onclick="setTab('sprint')">Now</button>
            <button class="tab" data-tab="backlog" onclick="setTab('backlog')">Backlog</button>
            <button class="tab" data-tab="features" onclick="setTab('features')">Features</button>
            <button class="tab" data-tab="sprints" onclick="setTab('sprints')">All sprints</button>
            <button class="tab" data-tab="settings" onclick="setTab('settings')">Settings</button>
        </div>

        <div id="tab-sprint" class="tab-panel"></div>
        <div id="tab-backlog" class="tab-panel" style="display:none"></div>
        <div id="tab-features" class="tab-panel" style="display:none"></div>
        <div id="tab-sprints" class="tab-panel" style="display:none"></div>
        <div id="tab-settings" class="tab-panel" style="display:none"></div>
    </div>

    <div class="modal-bg" id="modal"></div>
    <div class="toast" id="toast"></div>
    <button class="fab" onclick="openIssueEditor(null)" title="Add Issue">+</button>

    <script>
        // ============================================================
        // STATE
        // ============================================================
        var projects = [];
        var features = [];
        var issues = [];
        var sprints = [];

        var currentProjectId = null;
        var activeSprintId = null;   // global, replaces activeSprintByProject
        var plannerUpdatedAt = 0;
        var wtTasksDirty = false;    // set when AP edits a mirrored WT task

        // Mirrors WT's grid so AP can compute sprint numbers/dates standalone.
        var SPRINT_START_DATE_AP = new Date('2026-04-17T00:00:00Z');

        var currentTaskModalIssueId = null;
        var currentTaskModalTaskId = null;
        var currentTaskModalBlocks = 1;

        var wt = {
            sessions: [], tasks: [], sublists: {}, categoryOrder: [], categoryMeta: {},
            deletedIds: [], updatedAt: 0
        };

        var plannerDeleted = { projects: [], features: [], issues: [], sprints: [] };
        var wtDirty = false; // set when planner added wt categories/sublists

        // Hardcoded defaults — work standalone, overridable via URL params or Settings.
        // Worktracker writes to /work_tracker/personal-main, so we point there too.
        var FIREBASE_DB_URL = 'https://work-tracker-10960-default-rtdb.asia-southeast1.firebasedatabase.app/work_tracker';
        var FIREBASE_SYNC_ID = 'personal-main';
        var STALE_DB_URL = 'https://work-tracker-10960-default-rtdb.asia-southeast1.firebasedatabase.app';
        var DEFAULT_TRACKER_URL = 'https://hola-manan.github.io/session-logger/';
        var SETTINGS_KEY = 'plnr_settings';
        var LOCAL_KEY = 'plnr_v2';

        var currentTab = 'sprint';
        var expandedIssueIds = {};
        var backlogFilterFeature = '';
        var sprintFilterStatus = '';
        var sprintsTabFilter = 'active';

        var syncTimer = null;
        var autoSyncTimer = null;
        var burndownChart = null;
        var velocityChart = null;

        // ============================================================
        // INIT
        // ============================================================
        
        // ============================================================
        // ONE-TIME COLOR MIGRATION
        // Old saturated-purple palette -> new harmonious earth palette.
        // Runs on every load; idempotent. Saves locally + flags for sync.
        // ============================================================
        var LEGACY_COLOR_MAP = {
            '#8a63ff': '#D89A3F', '#8A63FF': '#D89A3F',
            '#bb79ff': '#9B86C4', '#BB79FF': '#9B86C4',
            '#79c4ff': '#6FA3C7', '#79C4FF': '#6FA3C7',
            '#6dffb1': '#7BB880', '#6DFFB1': '#7BB880',
            '#ffc24a': '#E0B255', '#FFC24A': '#E0B255',
            '#ff73a6': '#C77874', '#FF73A6': '#C77874',
            '#ff9d6e': '#C49563', '#FF9D6E': '#C49563',
            '#9affd4': '#7FA89B', '#9AFFD4': '#7FA89B',
            '#ff9a9a': '#B894A8', '#FF9A9A': '#B894A8',
            '#a4a4ff': '#A89C5C', '#A4A4FF': '#A89C5C'
        };
        function migrateLegacyColors() {
            var changed = false;
            var collections = [features, projects];
            for (var i = 0; i < collections.length; i++) {
                var arr = collections[i] || [];
                for (var j = 0; j < arr.length; j++) {
                    var c = arr[j] && arr[j].color;
                    if (c && LEGACY_COLOR_MAP[c]) {
                        arr[j].color = LEGACY_COLOR_MAP[c];
                        changed = true;
                    }
                }
            }
            if (changed) {
                try { saveLocal(); } catch (e) {}
                try { plannerUpdatedAt = Date.now(); } catch (e) {}
                try { if (typeof scheduleSync === 'function') scheduleSync(); } catch (e) {}
            }
        }

        function init() {
            loadSettings();
            applyUrlParams();
            loadLocal();
            migrateLegacyColors();
            migrateLegacySprints();
            ensureSprintsAP();
            wireLinks();
            renderProjectPicker();
            renderAll();
            if (FIREBASE_DB_URL && FIREBASE_SYNC_ID) syncNow(true);
            startAutoSync();
            attachKeyHandlers();
        }

        function loadSettings() {
            var urlMigrated = false;
            try {
                var s = localStorage.getItem(SETTINGS_KEY);
                if (s) {
                    var p = JSON.parse(s);
                    if (p.dbUrl) {
                        // Migrate stale URL that pointed at the wrong Firebase node (/personal-main
                        // instead of /work_tracker/personal-main).
                        if (p.dbUrl === STALE_DB_URL) {
                            p.dbUrl = FIREBASE_DB_URL;
                            localStorage.setItem(SETTINGS_KEY, JSON.stringify(p));
                            urlMigrated = true;
                        }
                        FIREBASE_DB_URL = p.dbUrl;
                    }
                    if (p.syncId) FIREBASE_SYNC_ID = p.syncId;
                }
            } catch (e) {}
            // After URL migration, drop local cache so we don't carry the seed-agtech created
            // against the wrong path. Real data will arrive via sync.
            if (urlMigrated) {
                try { localStorage.removeItem(LOCAL_KEY); } catch (e) {}
            }
        }
        function saveSettings() {
            try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ dbUrl: FIREBASE_DB_URL, syncId: FIREBASE_SYNC_ID })); } catch (e) {}
        }
        function applyUrlParams() {
            try {
                var p = new URLSearchParams(window.location.search);
                var u = p.get('dbUrl'); var s = p.get('syncId');
                
                // If the worktracker passed the old root URL, upgrade it to the new /work_tracker node
                if (u && u === STALE_DB_URL) {
                    u = FIREBASE_DB_URL;
                }

                if (u) FIREBASE_DB_URL = u;
                if (s) FIREBASE_SYNC_ID = s;
                if (u || s) saveSettings();
            } catch (e) {}
        }

        function loadLocal() {
            try {
                var s = localStorage.getItem(LOCAL_KEY);
                if (s) {
                    var p = JSON.parse(s);
                    projects = Array.isArray(p.projects) ? p.projects : [];
                    features = Array.isArray(p.features) ? p.features : [];
                    issues = Array.isArray(p.issues) ? p.issues : [];
                    sprints = Array.isArray(p.sprints) ? p.sprints : [];
                    currentProjectId = p.currentProjectId || null;
                    activeSprintId = p.activeSprintId || null;
                    // Backwards compat: migrate the old per-project map into a single global id.
                    if (!activeSprintId && p.activeSprintByProject && typeof p.activeSprintByProject === 'object') {
                        var legacyKeys = Object.keys(p.activeSprintByProject);
                        if (legacyKeys.length) activeSprintId = p.activeSprintByProject[legacyKeys[0]] || null;
                    }
                    plannerUpdatedAt = p.plannerUpdatedAt || 0;
                    plannerDeleted = p.plannerDeleted || { projects: [], features: [], issues: [], sprints: [] };
                    if (p.wt) wt = p.wt;
                }
            } catch (e) {}
        }
        function saveLocal() {
            try {
                localStorage.setItem(LOCAL_KEY, JSON.stringify({
                    projects: projects, features: features, issues: issues, sprints: sprints,
                    currentProjectId: currentProjectId,
                    activeSprintId: activeSprintId,
                    plannerUpdatedAt: plannerUpdatedAt,
                    plannerDeleted: plannerDeleted,
                    wt: wt
                }));
            } catch (e) {}
        }
        function markUpdated() {
            plannerUpdatedAt = Date.now();
            saveLocal();
            scheduleSync();
        }

        function wireLinks() {
            var link = document.getElementById('link-tracker');
            var stored = '';
            try { stored = localStorage.getItem('plnr_tracker_url') || ''; } catch (e) {}
            if (stored === 'https://hola-manan.github.io/work-tracker/') {
                stored = ''; try { localStorage.removeItem('plnr_tracker_url'); } catch (e) {}
            }
            var ref = document.referrer || '';
            var base = stored ||
                (ref && /github\.io|localhost|127\.0\.0\.1/i.test(ref) ? ref.replace(/\?.*$/, '') : '') ||
                DEFAULT_TRACKER_URL;
            link.href = base;
            link.addEventListener('click', function (e) {
                e.preventDefault();
                if (FIREBASE_DB_URL && FIREBASE_SYNC_ID) {
                    var trackerDbUrl = FIREBASE_DB_URL.replace(/\/work_tracker\/?$/, '');
                    window.location.href = base + (base.indexOf('?') === -1 ? '?' : '&') +
                        'dbUrl=' + encodeURIComponent(trackerDbUrl) +
                        '&syncId=' + encodeURIComponent(FIREBASE_SYNC_ID);
                } else {
                    window.location.href = base;
                }
            });
        }

        function attachKeyHandlers() {
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeModal();
            });
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
        function escHtml(s) {
            if (s == null) return '';
            return String(s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function todayISO() { return new Date().toISOString().slice(0, 10) }
        function isoToDate(iso) {
            if (!iso) return null;
            var p = iso.split('-');
            return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        }
        function dateToISO(d) {
            if (!d) return '';
            var m = String(d.getMonth() + 1).padStart(2, '0');
            var dd = String(d.getDate()).padStart(2, '0');
            return d.getFullYear() + '-' + m + '-' + dd;
        }
        function daysBetween(a, b) {
            var msDay = 86400000;
            var da = isoToDate(a), db = isoToDate(b);
            if (!da || !db) return 0;
            return Math.round((db - da) / msDay);
        }
        function addDays(iso, n) {
            var d = isoToDate(iso); if (!d) return '';
            d.setDate(d.getDate() + n);
            return dateToISO(d);
        }
        function fmtDate(iso) {
            if (!iso) return '';
            var d = isoToDate(iso); if (!d) return iso;
            var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return months[d.getMonth()] + ' ' + d.getDate();
        }
        function fmtHours(blocks) {
            var h = (blocks || 0) * 0.5;
            if (h === 0) return '0h';
            if (h < 1) return (h * 60) + 'm';
            if (h % 1 === 0) return h + 'h';
            return h.toFixed(1) + 'h';
        }
        function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)) }

        // ── Sprint grid helpers (mirror of WT) ──
        function getSprintNumberAP(dateStr) {
            var d = new Date(dateStr + 'T12:00:00');
            var diffDays = Math.floor((d.getTime() - SPRINT_START_DATE_AP.getTime()) / 86400000);
            return Math.floor(diffDays / 14) + 1;
        }
        function getSprintDatesAP(num) {
            var start = new Date(SPRINT_START_DATE_AP.getTime() + (num - 1) * 14 * 86400000);
            var end = new Date(start.getTime() + 13 * 86400000);
            return { start: start.toISOString().slice(0, 10), end: end.toISOString().slice(0, 10) };
        }
        function makeSprintIdAP(num) { return 'sprint-' + num; }
        function ensureSprintsAP() {
            var todayN = getSprintNumberAP(todayISO());
            if (todayN < 1) todayN = 1;
            var maxN = todayN + 1;
            var added = false;
            for (var n = 1; n <= maxN; n++) {
                var exists = sprints.some(function (s) { return s.number === n; });
                if (!exists) {
                    var d = getSprintDatesAP(n);
                    var status = n < todayN ? 'completed' : (n === todayN ? 'active' : 'planning');
                    sprints.push({
                        id: makeSprintIdAP(n),
                        number: n,
                        startDate: d.start, endDate: d.end,
                        name: 'Sprint ' + n,
                        goal: '',
                        status: status,
                        capacityBlocks: 0,
                        createdAt: Date.now(),
                        updatedAt: Date.now()
                    });
                    added = true;
                }
            }
            sprints.sort(function (a, b) { return a.number - b.number; });
            if (added) { plannerUpdatedAt = Date.now(); saveLocal(); }
            if (!activeSprintId) {
                var todaySp = sprints.filter(function (s) { return s.number === todayN; })[0];
                if (todaySp) activeSprintId = todaySp.id;
            }
            return added;
        }
        // One-time migration: snap legacy per-project sprints to the global grid.
        function migrateLegacySprints() {
            var needs = sprints.some(function (s) { return s && (s.projectId !== undefined || typeof s.number !== 'number'); });
            if (!needs) return false;
            var byNumber = {};
            var idRemap = {};
            sprints.forEach(function (s) {
                if (!s) return;
                var sd = s.startDate || todayISO();
                var n = getSprintNumberAP(sd);
                if (n < 1) n = 1;
                var grid = getSprintDatesAP(n);
                var newId = makeSprintIdAP(n);
                if (s.id && s.id !== newId) idRemap[s.id] = newId;
                if (!byNumber[n]) {
                    byNumber[n] = {
                        id: newId, number: n,
                        name: s.name || 'Sprint ' + n,
                        goal: s.goal || '',
                        startDate: grid.start, endDate: grid.end,
                        status: s.status || 'planning',
                        capacityBlocks: Number(s.capacityBlocks) || 0,
                        createdAt: s.createdAt || Date.now(),
                        updatedAt: s.updatedAt || Date.now()
                    };
                } else {
                    var ex = byNumber[n];
                    if (s.name && s.name.length > (ex.name || '').length) ex.name = s.name;
                    if (s.goal && !ex.goal) ex.goal = s.goal;
                    if ((Number(s.capacityBlocks) || 0) > ex.capacityBlocks) ex.capacityBlocks = Number(s.capacityBlocks) || 0;
                    if (s.status === 'active' && ex.status !== 'active') ex.status = 'active';
                }
            });
            sprints = Object.keys(byNumber).map(function (k) { return byNumber[k]; })
                .sort(function (a, b) { return a.number - b.number; });
            // Rewrite issue sprintId refs to the snapped IDs.
            issues.forEach(function (it) {
                if (it.sprintId && idRemap[it.sprintId]) {
                    it.sprintId = idRemap[it.sprintId];
                    it.updatedAt = Date.now();
                }
            });
            // If the chosen active sprint got snapped to a new id, follow it.
            if (activeSprintId && idRemap[activeSprintId]) activeSprintId = idRemap[activeSprintId];
            plannerUpdatedAt = Date.now();
            saveLocal();
            return true;
        }
        function getSprintByNumberAP(n) {
            for (var i = 0; i < sprints.length; i++) { if (sprints[i].number === n) return sprints[i]; }
            return null;
        }
        function getActiveSprintAP() {
            if (activeSprintId) {
                var s = sprints.find(function (x) { return x.id === activeSprintId; });
                if (s) return s;
            }
            var todayN = getSprintNumberAP(todayISO());
            return getSprintByNumberAP(todayN);
        }

        function showToast(msg, isErr) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.style.borderColor = isErr ? 'rgba(210,106,92,0.6)' : 'var(--ui-border-strong)';
            t.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(function () { t.classList.remove('show') }, 2200);
        }
        function setSyncState(state) { document.getElementById('sync-dot').className = 'sync-dot ' + state }

        function currentProject() {
            if (!currentProjectId) return null;
            return projects.find(function (p) { return p.id === currentProjectId }) || null;
        }
        function setCurrentProject(id) {
            currentProjectId = id || null;

        function renderProjectPicker() {
            var sel = document.getElementById('project-picker');
            if (!sel) return;
            sel.innerHTML = '';
            var active = projects.filter(function (p) { return p.status !== 'archived' });
            if (!active.length) {

                o.value = ''; o.textContent = '(no projects)'; o.disabled = true; o.selected = true;
                sel.appendChild(o);

            }
            var sep = document.createElement('option'); sep.disabled = true; sep.textContent = '──────'; sel.appendChild(sep);

        }

        // ============================================================
        // LEGACY TRANSFORM (old bundled planner → new schema)
        // ============================================================
        function transformLegacyProject(p, sublists) {
            var id = String(p.id);
            var name = p.title || p.name || '(unnamed)';
            var trackCat = p.cat ? String(p.cat) : '';
            var trackSub = p.sub ? String(p.sub) : '';
            // Infer trackCat/trackSub by looking up the project name in sublists.
            if (!trackCat && !trackSub && sublists) {
                var lname = String(name).toLowerCase();
                var cats = Object.keys(sublists);
                for (var i = 0; i < cats.length; i++) {
                    var subs = sublists[cats[i]] || [];
                    if (subs.indexOf(lname) !== -1) {
                        trackCat = cats[i]; trackSub = lname;
                        break;
                    }
                }
            }
            var palette = ['#D89A3F', '#9B86C4', '#6FA3C7', '#7BB880', '#E0B255', '#C77874', '#C49563', '#7FA89B', '#B894A8', '#A89C5C'];
            return {
                id: id,
                name: name,
                description: p.description || '',
                color: p.color || palette[(Number(p.id) || 0) % palette.length],
                trackCat: trackCat,
                trackSub: trackSub,
                status: p.status === 'archived' ? 'archived' : 'active',
                createdAt: Number(p.id) || Date.now(),
                updatedAt: Number(p.updatedAt) || Number(p.id) || Date.now()
            };
        }

        function transformLegacyFeature(f, projects) {
            var id = String(f.id);
            var projectId = f.projectId ? String(f.projectId) : '';
            var parent = null;
            for (var i = 0; i < projects.length; i++) {
                if (projects[i].id === projectId) { parent = projects[i]; break; }
            }
            return {
                id: id,
                projectId: projectId,
                title: f.title || '(untitled)',
                description: f.description || '',
                color: f.color || (parent ? parent.color : '#D89A3F'),
                trackCat: f.trackCat || '',
                trackSub: f.trackSub || '',
                status: f.status === 'archived' ? 'archived' : 'active',
                createdAt: Number(f.id) || Date.now(),
                updatedAt: Number(f.updatedAt) || Number(f.id) || Date.now()
            };
        }

        function transformLegacyIssue(it, featuresArr, fallbackProjectId) {
            var id = String(it.id);
            var featureId = it.featureId ? String(it.featureId) : null;
            var projectId = fallbackProjectId;
            if (featureId) {
                var parent = null;
                for (var i = 0; i < featuresArr.length; i++) {
                    if (featuresArr[i].id === featureId) { parent = featuresArr[i]; break; }
                }
                if (parent) projectId = parent.projectId;
                else featureId = null; // dangling reference
            }
            var stat = it.status;
            if (stat === 'backlog' || !stat) stat = 'todo';
            return {
                id: id,
                projectId: projectId,
                featureId: featureId,
                title: it.title || '(untitled)',
                description: it.description || '',
                type: it.type || 'story',
                priority: Number(it.priority) || 3,
                status: stat,
                sprintId: it.sprintId ? String(it.sprintId) : null,
                trackCat: it.trackCat || '',
                trackSub: it.trackSub || '',
                acceptance: it.acceptance || '',
                tasks: Array.isArray(it.tasks) ? it.tasks : (Array.isArray(it.subtasks) ? it.subtasks : []),
                order: Number(it.order) || 0,
                createdAt: Number(it.id) || Date.now(),
                updatedAt: Number(it.updatedAt) || Number(it.id) || Date.now(),
                completedAt: it.completedAt || null
            };
        }

        // ============================================================
        // SYNC
        // ============================================================
        function makeFirebasePath() {
            var dbUrl = (FIREBASE_DB_URL || '').trim().replace(/\/+$/, '');
            var syncId = (FIREBASE_SYNC_ID || '').trim();
            if (!dbUrl || !syncId) return '';
            return dbUrl + '/' + encodeURIComponent(syncId) + '.json';
        }
        function scheduleSync() {
            if (syncTimer) clearTimeout(syncTimer);
            syncTimer = setTimeout(function () { syncNow(true) }, 800);
        }
        function startAutoSync() {
            if (autoSyncTimer) clearInterval(autoSyncTimer);
            autoSyncTimer = setInterval(function () {
                if (document.hidden) return;
                syncNow(true);
            }, 30000);
            window.addEventListener('focus', function () { syncNow(true) });
        }

        function syncNow(silent) {
            var url = makeFirebasePath();
            if (!url) {
                if (!silent) showToast('Set Firebase URL and Sync ID in Settings', true);
                setSyncState('err');
                return Promise.resolve();
            }
            setSyncState('busy');
            return fetch(url, { cache: 'no-store' })
                .then(function (res) {
                    if (!res.ok) throw new Error('fetch ' + res.status);
                    return res.json();
                })
                .then(function (remote) {
                    remote = remote || {};

                    // --- 1. Worktracker fields first (legacy transform needs sublists) ---
                    if (Array.isArray(remote.sessions)) wt.sessions = remote.sessions;
                    if (Array.isArray(remote.tasks)) wt.tasks = remote.tasks;
                    if (Array.isArray(remote.deletedIds)) wt.deletedIds = remote.deletedIds;

                    var rCatOrder = Array.isArray(remote.categoryOrder) ? remote.categoryOrder : [];
                    var rCatMeta = (remote.categoryMeta && typeof remote.categoryMeta === 'object') ? remote.categoryMeta : {};
                    var rSublists = (remote.sublists && typeof remote.sublists === 'object') ? remote.sublists : {};

                    wt.categoryOrder = unionArrays(rCatOrder, wt.categoryOrder || []);
                    var mergedMeta = Object.assign({}, rCatMeta);
                    Object.keys(wt.categoryMeta || {}).forEach(function (k) {
                        if (!mergedMeta[k]) mergedMeta[k] = wt.categoryMeta[k];
                    });
                    wt.categoryMeta = mergedMeta;
                    var mergedSubs = {};
                    Object.keys(rSublists).forEach(function (k) { mergedSubs[k] = (rSublists[k] || []).slice(); });
                    Object.keys(wt.sublists || {}).forEach(function (k) {
                        if (!mergedSubs[k]) mergedSubs[k] = [];
                        (wt.sublists[k] || []).forEach(function (s) {
                            if (mergedSubs[k].indexOf(s) === -1) mergedSubs[k].push(s);
                        });
                    });
                    wt.sublists = mergedSubs;

                    var rWtTs = Number(remote.updatedAt || 0);
                    wt.updatedAt = Math.max(rWtTs, wt.updatedAt || 0);

                    // --- 2. Planner subkey ---
                    var rPlanner = (remote.planner && typeof remote.planner === 'object') ? remote.planner : {};
                    var rPlannerProjects = Array.isArray(rPlanner.projects) ? rPlanner.projects : [];
                    var rPlannerFeatures = Array.isArray(rPlanner.features) ? rPlanner.features : [];
                    var rPlannerIssues = Array.isArray(rPlanner.issues) ? rPlanner.issues : [];
                    var rSprints = Array.isArray(rPlanner.sprints) ? rPlanner.sprints : [];
                    var rPlannerDeleted = (rPlanner.deleted && typeof rPlanner.deleted === 'object')
                        ? rPlanner.deleted : { projects: [], features: [], issues: [], sprints: [] };
                    var rPlannerTs = Number(rPlanner.plannerUpdatedAt || remote.plannerUpdatedAt || 0);
                    var localTs = plannerUpdatedAt || 0;

                    // --- 3. Transform legacy top-level entities (old bundled planner) ---
                    var legacyProjectsRaw = Array.isArray(remote.projects) ? remote.projects : [];
                    var legacyFeaturesRaw = Array.isArray(remote.features) ? remote.features : [];
                    var legacyIssuesRaw = Array.isArray(remote.issues) ? remote.issues : [];
                    var migProjects = legacyProjectsRaw.map(function (p) { return transformLegacyProject(p, wt.sublists); });
                    var migFeatures = legacyFeaturesRaw.map(function (f) { return transformLegacyFeature(f, migProjects); });
                    var fallbackProj = migProjects.length ? migProjects[0].id : null;
                    var migIssues = legacyIssuesRaw.map(function (it) { return transformLegacyIssue(it, migFeatures, fallbackProj); });

                    // Planner-side entries placed AFTER migrations so they override on duplicate id.
                    var rProjects = migProjects.concat(rPlannerProjects);
                    var rFeatures = migFeatures.concat(rPlannerFeatures);
                    var rIssues = migIssues.concat(rPlannerIssues);

                    // --- 4. Deleted + entity merge ---
                    var mergedDeleted = {
                        projects: unionArrays(plannerDeleted.projects, rPlannerDeleted.projects),
                        features: unionArrays(plannerDeleted.features, rPlannerDeleted.features),
                        issues: unionArrays(plannerDeleted.issues, rPlannerDeleted.issues),
                        sprints: unionArrays(plannerDeleted.sprints, rPlannerDeleted.sprints)
                    };

                    var mergedProjects = mergeById(projects, rProjects, mergedDeleted.projects, localTs >= rPlannerTs);
                    var mergedFeatures = mergeById(features, rFeatures, mergedDeleted.features, localTs >= rPlannerTs);
                    var mergedIssues = mergeById(issues, rIssues, mergedDeleted.issues, localTs >= rPlannerTs);
                    var mergedSprints = mergeById(sprints, rSprints, mergedDeleted.sprints, localTs >= rPlannerTs);

                    var rActiveSprintId = rPlanner.activeSprintId || null;
                    if (!rActiveSprintId && rPlanner.activeSprintByProject && typeof rPlanner.activeSprintByProject === 'object') {
                        var rLegacyKeys = Object.keys(rPlanner.activeSprintByProject);
                        if (rLegacyKeys.length) rActiveSprintId = rPlanner.activeSprintByProject[rLegacyKeys[0]] || null;
                    }
                    var mergedActiveSprintId = (localTs >= rPlannerTs)
                        ? (activeSprintId || rActiveSprintId)
                        : (rActiveSprintId || activeSprintId);

                    var mergedCurrent = currentProjectId ||
                        (rPlanner.currentProjectId && mergedProjects.find(function (p) { return p.id === rPlanner.currentProjectId })
                            ? rPlanner.currentProjectId : null);

                    var hasLocalPlanner = projects.length || features.length || issues.length || sprints.length ||
                        plannerDeleted.projects.length || plannerDeleted.features.length ||
                        plannerDeleted.issues.length || plannerDeleted.sprints.length;
                    var hasRemotePlanner = !!rPlannerTs || rPlannerProjects.length || rPlannerFeatures.length ||
                        rPlannerIssues.length || rSprints.length;

                    // Compare merged against the PLANNER-SIDE remote (not legacy-augmented), otherwise
                    // we'd see a constant "changed" every sync (legacy entries are always re-included).
                    var changed = wtDirty ||
                        localTs > rPlannerTs ||
                        mergedProjects.length !== rPlannerProjects.length ||
                        mergedFeatures.length !== rPlannerFeatures.length ||
                        mergedIssues.length !== rPlannerIssues.length ||
                        mergedSprints.length !== rSprints.length;

                    projects = mergedProjects;
                    features = mergedFeatures;
                    issues = mergedIssues;
                    sprints = mergedSprints;
                    activeSprintId = mergedActiveSprintId;
                    plannerDeleted = mergedDeleted;
                    currentProjectId = mergedCurrent;

                    // Snap legacy sprints to the grid, dedupe by number, drop projectId.
                    migrateLegacySprints();
                    // Backfill missing sprint entities so WT/AP both see a continuous calendar.
                    ensureSprintsAP();

                    var nextTs = Math.max(localTs, rPlannerTs);
                    if (changed) nextTs = Math.max(nextTs + 1, Date.now());
                    plannerUpdatedAt = nextTs;
                    saveLocal();

                    // Auto-seed AgTech if no projects exist and the user hasn't explicitly deleted it.
                    var SEED_AGTECH_ID = 'seed-agtech';
                    var seeded = false;
                    if (!projects.length && plannerDeleted.projects.indexOf(SEED_AGTECH_ID) === -1) {
                        var seed = {
                            id: SEED_AGTECH_ID,
                            name: 'AgTech',
                            description: 'Side project',
                            color: '#6dffb1',
                            trackCat: 'side project',
                            trackSub: 'agtech',
                            status: 'active',
                            createdAt: Date.now(),
                            updatedAt: Date.now()
                        };
                        projects.push(seed);
                        currentProjectId = seed.id;
                        plannerUpdatedAt = Date.now();
                        saveLocal();
                        seeded = true;
                        changed = true;
                    }

                    if (!changed && !seeded) {
                        renderProjectPicker();
                        renderAll();
                        setSyncState('ok');
                        return;
                    }

                    // Don't push an empty payload — wait until there's real local activity.
                    if (!hasLocalPlanner && !seeded && !wtDirty && !wtTasksDirty) {
                        renderProjectPicker();
                        renderAll();
                        setSyncState('ok');
                        return;
                    }

                    var payload = Object.assign({}, remote, {
                        planner: {
                            projects: projects, features: features, issues: issues, sprints: sprints,
                            currentProjectId: currentProjectId,
                            activeSprintId: activeSprintId,
                            deleted: plannerDeleted,
                            plannerUpdatedAt: plannerUpdatedAt
                        }
                    });

                    if (wtTasksDirty) {
                        // AP edited a mirrored WT task. Push the whole tasks array so WT's per-task
                        // updatedAt merge picks up our changes.
                        payload.tasks = wt.tasks;
                    }

                    if (wtDirty) {
                        // Only write the cat/sub trio — worktracker's merge unions these regardless of timestamp.
                        // Do NOT bump updatedAt: worktracker uses it to break session/task ties, and bumping
                        // would make our (stale) view of sessions/tasks win over worktracker's actual edits.
                        payload.categoryOrder = wt.categoryOrder;
                        payload.categoryMeta = wt.categoryMeta;
                        payload.sublists = wt.sublists;
                    }

                    return fetch(url, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    }).then(function (res2) {
                        if (!res2.ok) throw new Error('put ' + res2.status);
                        wtDirty = false;
                        wtTasksDirty = false;
                        renderProjectPicker();
                        renderAll();
                        setSyncState('ok');
                        if (!silent) showToast('Synced');
                    });
                })
                .catch(function (err) {
                    console.warn('sync error', err);
                    setSyncState('err');
                    if (!silent) showToast('Sync failed: ' + err.message, true);
                });
        }

        function unionArrays(a, b) {
            var out = (a || []).slice();
            (b || []).forEach(function (x) { if (out.indexOf(x) === -1) out.push(x); });
            return out;
        }
        function mergeById(local, remote, deleted, localWins) {
            var map = {};
            (remote || []).forEach(function (x) {
                if (!x || !x.id) return;
                if (deleted.indexOf(x.id) !== -1) return;
                map[x.id] = x;
            });
            (local || []).forEach(function (x) {
                if (!x || !x.id) return;
                if (deleted.indexOf(x.id) !== -1) return;
                if (!map[x.id]) { map[x.id] = x; return; }
                var l = x, r = map[x.id];
                var lTs = Number(l.updatedAt || l.createdAt || 0);
                var rTs = Number(r.updatedAt || r.createdAt || 0);
                if (lTs > rTs || (lTs === rTs && localWins)) map[x.id] = l;
            });
            return Object.keys(map).map(function (k) { return map[k]; });
        }

        // ============================================================
        // DISPATCH
        // ============================================================
        function setTab(t) {
            currentTab = t;
            document.querySelectorAll('.tab').forEach(function (el) {
                el.classList.toggle('active', el.getAttribute('data-tab') === t);
            });

                el.style.display = (el.id === 'tab-' + t) ? '' : 'none';
            });

        function renderAll() {
            if (currentTab === 'sprint') renderSprintTab();
            else if (currentTab === 'backlog') renderBacklogTab();
            else if (currentTab === 'features') renderFeaturesTab();
            else if (currentTab === 'sprints') renderSprintsTab();
            else if (currentTab === 'settings') renderSettingsTab();
        }

                '<div class="card">' +
